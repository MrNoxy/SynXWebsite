<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Pixel Rig Studio</title>
<style>
  :root{
    --bg:#17161b; --panel:#1c1b21; --panel2:#1f1e24; --border:#3a3942;
    --text:#e6e4ea; --muted:#8b8994; --accent:#e8595f; --accentText:#18171c;
    --stagebg:#111014;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; touch-action:none;
  }
  #app{height:100dvh; width:100vw; display:flex; overflow:hidden;}

  .rail{width:56px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:8px;}
  .rail-logo{width:32px; height:32px; background:var(--accent); border-radius:7px; display:flex;
    align-items:center; justify-content:center; color:var(--accentText); font-weight:700; font-size:11px; margin-bottom:6px;}
  .rail-btn{width:42px; height:42px; border-radius:9px; border:none; background:none; cursor:pointer;
    color:var(--muted); font-size:19px; display:flex; align-items:center; justify-content:center; touch-action:manipulation;}
  .rail-btn:hover{background:#232228; color:#fff;}
  .rail-btn.active{background:var(--accent); color:var(--accentText);}

  .content{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{height:48px; flex-shrink:0; border-bottom:1px solid var(--border); background:#1a191f;
    display:flex; align-items:center; justify-content:space-between; padding:0 16px; gap:8px;}
  .topbar .title{font-size:13px; font-weight:700; letter-spacing:.02em;}
  .topbar .dims{font-size:10px; color:var(--muted); margin-left:8px;}
  .topbar .actions{display:flex; gap:8px; align-items:center;}

  .main{flex:1; min-height:0; display:flex; gap:12px; padding:12px; overflow:hidden; touch-action:none;}
  @media (max-width:767px){ .main{flex-direction:column;} }

  .stage-wrap{flex:1; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center;
    background:var(--stagebg); border:1px solid var(--border); border-radius:10px; overflow:hidden; position:relative; touch-action:none;}
  .stage-col{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; gap:8px;}
  .side{width:100%; display:flex; flex-direction:column; gap:12px; min-height:0; overflow-y:auto; flex-shrink:0; touch-action:pan-y;}
  @media (min-width:768px){ .side{width:280px;} }

  canvas{image-rendering:pixelated; max-width:100%; max-height:100%; width:auto; height:auto; touch-action:none; display:block;}

  .panel{border:1px solid var(--border); border-radius:9px; background:var(--panel2); display:flex; flex-direction:column; min-height:0;}
  .panel-header{display:flex; align-items:center; justify-content:space-between; padding:7px 12px;
    border-bottom:1px solid var(--border); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); flex-shrink:0; gap:6px;}
  .panel-body{padding:12px; overflow-y:auto; min-height:0; touch-action:pan-y;}

  .btn{padding:8px 12px; font-size:12px; border:1px solid var(--border); border-radius:7px; background:#232228;
    color:#c7c5cc; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; touch-action:manipulation;}
  .btn:hover{border-color:rgba(232,89,95,.6); color:#fff;}
  .btn.active{background:var(--accent); border-color:var(--accent); color:var(--accentText);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accentText); font-weight:700;}
  .btn.small{padding:4px 8px; font-size:10px;}
  .btn.block{width:100%;}
  .btn.pulse{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,89,95,.6);}50%{box-shadow:0 0 0 5px rgba(232,89,95,0);}}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .row{display:flex; align-items:center; gap:8px;}
  .mb{margin-bottom:8px;} .mt{margin-top:8px;}

  input[type=range]{width:100%; accent-color:var(--accent); touch-action:pan-x;}
  input[type=color]{width:40px; height:40px; background:none; border:1px solid var(--border); border-radius:7px; padding:0; cursor:pointer;}
  input[type=text]{background:var(--stagebg); border:1px solid var(--border); border-radius:7px; padding:8px;
    color:var(--text); font-family:inherit; font-size:12px; width:100%;}
  label.check{display:flex; align-items:center; gap:8px; font-size:12px; color:#c7c5cc; cursor:pointer;}

  .swatch{width:24px; height:24px; border-radius:5px; border:1px solid var(--border); cursor:pointer; padding:0;}
  .swatch-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px;}

  .bone-list{display:flex; flex-direction:column; gap:2px; max-height:150px; overflow-y:auto; touch-action:pan-y;}
  .bone-item{display:flex; align-items:center; gap:8px; text-align:left; width:100%; padding:5px 8px;
    border-radius:6px; background:none; border:none; color:var(--text); font-family:inherit; font-size:11.5px; cursor:pointer;}
  .bone-item:hover{background:#232228;}
  .bone-item.selected{background:#2b2a32;}
  .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}

  .caption{font-size:11px; color:var(--muted); flex-shrink:0; line-height:1.4;}
  .pose-row{margin-bottom:9px;}
  .pose-label{display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--muted); margin-bottom:3px; gap:6px;}
  .flip-check{display:flex; align-items:center; gap:3px; font-size:9px; cursor:pointer; flex-shrink:0;}
  .flip-check input{margin:0;}

  .upload-label{cursor:pointer; padding:22px; border:1px dashed var(--border); border-radius:10px; font-size:13px;
    color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:10px;}
  .upload-label:hover{border-color:rgba(232,89,95,.6);}
  .upload-label input{display:none;}
  .hidden{display:none !important;}
  img.preview-img{max-width:100%; max-height:100%; border-radius:8px; object-fit:contain;}

  /* timeline */
  .timeline-bar{flex-shrink:0; border:1px solid var(--border); border-radius:9px; background:var(--panel2); padding:8px 10px;}
  .tl-controls{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .tl-time{font-size:10px; color:var(--muted); white-space:nowrap;}
  .tl-dur{display:flex; align-items:center; gap:4px; font-size:10px; color:var(--muted); margin-left:auto;}
  .tl-dur button{width:20px; height:20px; border-radius:5px; border:1px solid var(--border); background:#232228; color:#c7c5cc; cursor:pointer; font-size:11px; touch-action:manipulation;}
  .tl-track{position:relative; height:34px; background:var(--stagebg); border-radius:6px; border:1px solid var(--border); touch-action:none; cursor:pointer;}
  .tl-playhead{position:absolute; top:0; bottom:0; width:2px; background:var(--accent); pointer-events:none; z-index:3;}
  .tl-marker{position:absolute; top:50%; width:13px; height:13px; background:#f2b134; border:2px solid #18171c;
    transform:translate(-50%,-50%) rotate(45deg); cursor:grab; z-index:2;}
  .tl-marker.selected{background:var(--accent);}

  ::-webkit-scrollbar{width:7px; height:7px;}
  ::-webkit-scrollbar-track{background:#1a1a1f;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>
<body>
<div id="app"></div>

function nikkiToColorGrid() {
  const { w, h, palette, grid } = NIKKI_DATA;
  const out = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      const idx = grid[y][x];
      row.push(idx === -1 ? null : palette[idx]);
    }
    out.push(row);
  }
  return out;
}
function blankColorGrid(w, h) {
  const out = [];
  for (let y = 0; y < h; y++) out.push(new Array(w).fill(null));
  return out;
}

function findOpaqueBBox(colorGrid) {
  const h = colorGrid.length, w = colorGrid[0].length;
  let minX = w, maxX = -1, minY = h, maxY = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (colorGrid[y][x]) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  if (maxX < 0) return { minX: 0, maxX: w - 1, minY: 0, maxY: h - 1 };
  return { minX, maxX, minY, maxY };
}

function autoRigBones(colorGrid) {
  const { minX, maxX, minY, maxY } = findOpaqueBBox(colorGrid);
  const W = maxX - minX, H = maxY - minY;
  const cx = (minX + maxX) / 2;
  const topY = minY, chestY = minY + H * 0.16, neckTopY = minY + H * 0.11;
  const hipY = minY + H * 0.52, kneeY = minY + H * 0.75, ankleY = minY + H * 0.90, footY = minY + H * 0.98;
  const shX = W * 0.16, elX = W * 0.42, wristX = W * 0.45, handX = W * 0.47;
  const hipX = W * 0.13, ankX = W * 0.13, toeX = W * 0.10;
  const p = (x, y) => ({ x, y });

  const b = {};
  b.torso     = { pivot: p(cx, chestY), tip: p(cx, hipY) };
  b.neck      = { pivot: p(cx, chestY), tip: p(cx, neckTopY) };
  b.head      = { pivot: p(cx, neckTopY), tip: p(cx, topY) };

  b.shoulderL = { pivot: p(cx, chestY + H * 0.02), tip: p(cx - shX, chestY + H * 0.02) };
  b.upperArmL = { pivot: p(cx - shX, chestY + H * 0.02), tip: p(cx - elX, chestY + H * 0.22) };
  b.lowerArmL = { pivot: p(cx - elX, chestY + H * 0.22), tip: p(cx - wristX, chestY + H * 0.38) };
  b.handL     = { pivot: p(cx - wristX, chestY + H * 0.38), tip: p(cx - handX, chestY + H * 0.46) };

  b.shoulderR = { pivot: p(cx, chestY + H * 0.02), tip: p(cx + shX, chestY + H * 0.02) };
  b.upperArmR = { pivot: p(cx + shX, chestY + H * 0.02), tip: p(cx + elX, chestY + H * 0.22) };
  b.lowerArmR = { pivot: p(cx + elX, chestY + H * 0.22), tip: p(cx + wristX, chestY + H * 0.38) };
  b.handR     = { pivot: p(cx + wristX, chestY + H * 0.38), tip: p(cx + handX, chestY + H * 0.46) };

  b.hipL      = { pivot: p(cx, hipY), tip: p(cx - hipX, hipY + H * 0.02) };
  b.upperLegL = { pivot: p(cx - hipX, hipY + H * 0.02), tip: p(cx - hipX, kneeY) };
  b.lowerLegL = { pivot: p(cx - hipX, kneeY), tip: p(cx - ankX, ankleY) };
  b.footL     = { pivot: p(cx - ankX, ankleY), tip: p(cx - ankX + toeX, footY) };

  b.hipR      = { pivot: p(cx, hipY), tip: p(cx + hipX, hipY + H * 0.02) };
  b.upperLegR = { pivot: p(cx + hipX, hipY + H * 0.02), tip: p(cx + hipX, kneeY) };
  b.lowerLegR = { pivot: p(cx + hipX, kneeY), tip: p(cx + ankX, ankleY) };
  b.footR     = { pivot: p(cx + ankX, ankleY), tip: p(cx + ankX - toeX, footY) };

  for (const id of BONE_ORDER) b[id].flip = false;
  return b;
}

function pointSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}
function nearestBoneId(x, y, bones) {
  let best = null, bestD = Infinity;
  for (const id of BONE_ORDER) {
    const bn = bones[id];
    if (!bn) continue;
    const d = pointSegDist(x, y, bn.pivot.x, bn.pivot.y, bn.tip.x, bn.tip.y);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}

function rot(x, y, a) { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }

function computeWorldTransforms(bones, poseAngles) {
  const world = {};
  function walk(id, parentWorld, parentRestPivot) {
    const bn = bones[id];
    const localAngle = ((poseAngles[id] || 0) * Math.PI) / 180;
    let pivot, angle;
    if (!parentWorld) { pivot = { x: bn.pivot.x, y: bn.pivot.y }; angle = localAngle; }
    else {
      const offX = bn.pivot.x - parentRestPivot.x, offY = bn.pivot.y - parentRestPivot.y;
      const [rx, ry] = rot(offX, offY, parentWorld.angle);
      pivot = { x: parentWorld.pivot.x + rx, y: parentWorld.pivot.y + ry };
      angle = parentWorld.angle + localAngle;
    }
    world[id] = { pivot, angle };
    for (const c of childrenOf(id)) walk(c, world[id], bn.pivot);
  }
  walk("torso", null, null);
  return world;
}

function resampleColorGrid(grid, newW, newH) {
  const oldH = grid.length, oldW = grid[0].length;
  if (newW === oldW && newH === oldH) return grid.map((r) => r.slice());
  const src = document.createElement("canvas");
  src.width = oldW; src.height = oldH;
  const sctx = src.getContext("2d");
  const imgData = sctx.createImageData(oldW, oldH);
  for (let y = 0; y < oldH; y++) for (let x = 0; x < oldW; x++) {
    const i = (y * oldW + x) * 4, c = grid[y][x];
    if (c) {
      imgData.data[i] = parseInt(c.slice(1, 3), 16);
      imgData.data[i + 1] = parseInt(c.slice(3, 5), 16);
      imgData.data[i + 2] = parseInt(c.slice(5, 7), 16);
      imgData.data[i + 3] = 255;
    }
  }
  sctx.putImageData(imgData, 0, 0);
  const dst = document.createElement("canvas");
  dst.width = newW; dst.height = newH;
  const dctx = dst.getContext("2d");
  dctx.imageSmoothingEnabled = newW < oldW;
  dctx.imageSmoothingQuality = "high";
  dctx.drawImage(src, 0, 0, oldW, oldH, 0, 0, newW, newH);
  const data = dctx.getImageData(0, 0, newW, newH).data;
  const out = [];
  for (let y = 0; y < newH; y++) {
    const row = [];
    for (let x = 0; x < newW; x++) {
      const i = (y * newW + x) * 4, a = data[i + 3];
      if (a < 64) row.push(null);
      else row.push(`#${data[i].toString(16).padStart(2,"0")}${data[i+1].toString(16).padStart(2,"0")}${data[i+2].toString(16).padStart(2,"0")}`);
    }
    out.push(row);
  }
  return out;
}

function bresenhamLine(x0, y0, x1, y1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  const pts = [];
  while (true) {
    pts.push([x0, y0]);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
  return pts;
}

/* =====================================================================
   ANIMATION TIME → POSE
   ===================================================================== */
function getLastKfTime() {
  return state.keyframes.reduce((m, k) => Math.max(m, k.t), 0);
}
function computePoseAtTimeClamped(t) {
  const sorted = [...state.keyframes].sort((a, b) => a.t - b.t);
  if (sorted.length === 0) return { pose: zeroPose(), flip: zeroFlip() };
  if (sorted.length === 1) return { pose: { ...sorted[0].pose }, flip: { ...sorted[0].flip } };
  if (t <= sorted[0].t) return { pose: { ...sorted[0].pose }, flip: { ...sorted[0].flip } };
  const last = sorted[sorted.length - 1];
  if (t >= last.t) return { pose: { ...last.pose }, flip: { ...last.flip } };
  for (let i = 0; i < sorted.length - 1; i++) {
    const cur = sorted[i], nxt = sorted[i + 1];
    if (t >= cur.t && t <= nxt.t) {
      const span = (nxt.t - cur.t) || 1, f = (t - cur.t) / span;
      const pose = {};
      for (const b of BONE_ORDER) { const a = cur.pose[b] || 0, c = nxt.pose[b] || 0; pose[b] = a + (c - a) * f; }
      return { pose, flip: { ...cur.flip } };
    }
  }
  return { pose: { ...last.pose }, flip: { ...last.flip } };
}
function computePoseAtTimeLooping(t, dur) {
  const sorted = [...state.keyframes].sort((a, b) => a.t - b.t);
  if (sorted.length === 0) return { pose: zeroPose(), flip: zeroFlip() };
  if (sorted.length === 1) return { pose: { ...sorted[0].pose }, flip: { ...sorted[0].flip } };
  let prev = sorted[sorted.length - 1], next = sorted[0];
  let prevT = prev.t - dur, nextT = next.t;
  for (let i = 0; i < sorted.length; i++) {
    const cur = sorted[i], nxt = sorted[(i + 1) % sorted.length];
    const curT = cur.t, nxtT = i === sorted.length - 1 ? nxt.t + dur : nxt.t;
    if (t >= curT && t <= nxtT) { prev = cur; next = nxt; prevT = curT; nextT = nxtT; break; }
  }
  const span = (nextT - prevT) || 1, f = (t - prevT) / span;
  const pose = {};
  for (const b of BONE_ORDER) { const a = prev.pose[b] || 0, c = next.pose[b] || 0; pose[b] = a + (c - a) * f; }

}
function applyPoseAtTime(t) {

}
function applyPoseAtTimeLooping(t) {

  for (const id of BONE_ORDER) state.bones[id].flip = !!flip[id];
}
function hasUnsavedPoseChanges() {
  const at = computePoseAtTimeClamped(state.playhead);
  for (const id of BONE_ORDER) {
    if (Math.abs((state.pose[id] || 0) - (at.pose[id] || 0)) > 0.5) return true;
    if (!!state.bones[id].flip !== !!at.flip[id]) return true;
  }
  return false;
}

function setupDrawTab() {
  const canvas = document.getElementById("drawCanvas");
  const ctx = canvas.getContext("2d");
  let painting = false;
  let shapeStart = null, shapeCur = null;
  let selDragStart = null; // {x,y,mode:'new'|'move'}
  let moveBuffer = null, moveOffset = { dx: 0, dy: 0 };

  function pushHistory() {
    state.history.push(state.colorGrid.map((r) => r.slice()));
    if (state.history.length > 40) state.history.shift();
  }

  function inSelection(x, y) {
    const s = state.selection;
    return s && x >= s.x0 && x <= s.x1 && y >= s.y0 && y <= s.y1;
  }

  function setCell(x, y, val) {
    const { w, h } = gridDims();
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    state.colorGrid[y][x] = val;

      if (mx !== x) state.colorGrid[y][mx] = val;

    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const c = state.colorGrid[y][x];
      ctx.fillStyle = c ? c : ((x + y) % 2 === 0 ? "#232228" : "#1c1b21");
      ctx.fillRect(x * DRAW_CELL, y * DRAW_CELL, DRAW_CELL, DRAW_CELL);

    ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1;
    for (let x = 0; x <= w; x++) { ctx.beginPath(); ctx.moveTo(x*DRAW_CELL,0); ctx.lineTo(x*DRAW_CELL,h*DRAW_CELL); ctx.stroke(); }
    for (let y = 0; y <= h; y++) { ctx.beginPath(); ctx.moveTo(0,y*DRAW_CELL); ctx.lineTo(w*DRAW_CELL,y*DRAW_CELL); ctx.stroke(); }

    // shape preview (line / rect)
    if (shapeStart && shapeCur && (state.tool === "line" || state.tool === "rect")) {
      ctx.globalAlpha = 0.6;
      if (state.tool === "line") {
        bresenhamLine(shapeStart.x, shapeStart.y, shapeCur.x, shapeCur.y).forEach(([x, y]) => {
          if (x < 0 || y < 0 || x >= w || y >= h) return;
          ctx.fillStyle = state.color;
          ctx.fillRect(x * DRAW_CELL, y * DRAW_CELL, DRAW_CELL, DRAW_CELL);
        });
      } else {
        const x0 = Math.min(shapeStart.x, shapeCur.x), x1 = Math.max(shapeStart.x, shapeCur.x);
        const y0 = Math.min(shapeStart.y, shapeCur.y), y1 = Math.max(shapeStart.y, shapeCur.y);
        for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
          if (!state.rectFilled && x !== x0 && x !== x1 && y !== y0 && y !== y1) continue;
          if (x < 0 || y < 0 || x >= w || y >= h) continue;
          ctx.fillStyle = state.color;
          ctx.fillRect(x * DRAW_CELL, y * DRAW_CELL, DRAW_CELL, DRAW_CELL);
        }
      }
      ctx.globalAlpha = 1;
    }

    // move-buffer preview
    if (moveBuffer) {
      ctx.globalAlpha = 0.85;
      for (let ry = 0; ry < moveBuffer.h; ry++) for (let rx = 0; rx < moveBuffer.w; rx++) {
        const val = moveBuffer.data[ry][rx];
        if (val == null) continue;
        const nx = moveBuffer.x0 + rx + moveOffset.dx, ny = moveBuffer.y0 + ry + moveOffset.dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        ctx.fillStyle = val;
        ctx.fillRect(nx * DRAW_CELL, ny * DRAW_CELL, DRAW_CELL, DRAW_CELL);
      }
      ctx.globalAlpha = 1;
    }

    // selection outline
    if (state.selection) {
      const s = state.selection;
      const sx0 = (moveBuffer ? s.x0 : s.x0), sy0 = s.y0;
      const ox = moveBuffer ? moveOffset.dx : 0, oy = moveBuffer ? moveOffset.dy : 0;
      ctx.strokeStyle = "#5fb3e8"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.strokeRect((s.x0+ox) * DRAW_CELL, (s.y0+oy) * DRAW_CELL, (s.x1 - s.x0 + 1) * DRAW_CELL, (s.y1 - s.y0 + 1) * DRAW_CELL);
      ctx.setLineDash([]);
    }
  }

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    return { x: Math.floor(((e.clientX - rect.left) * scale) / DRAW_CELL), y: Math.floor(((e.clientY - rect.top) * scale) / DRAW_CELL) };
  }

  function paintAt(x, y) {
    const { w, h } = gridDims();
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    if (state.tool === "eyedrop") {
      const c = state.colorGrid[y][x];
      if (c) { state.color = c; document.getElementById("colorPicker").value = c; document.getElementById("colorHex").value = c; }
      setToolUI("pencil");
      return;
    }
    if (state.tool === "fill") {
      const target = state.colorGrid[y][x];
      if (target === state.color) return;
      const stack = [[x, y]], seen = new Set();
      while (stack.length) {
        const [cx, cy] = stack.pop();
        const key = cx + "," + cy;
        if (seen.has(key) || cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
        if (state.colorGrid[cy][cx] !== target) continue;
        seen.add(key);
        setCell(cx, cy, state.color);
        stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
      }
      return;
    }
    applyBrush(x, y, state.tool === "eraser" ? null : state.color);
  }

  function setToolUI(tool) {
    state.tool = tool;
    document.querySelectorAll(".tool-btn").forEach((b) => b.classList.toggle("active", b.dataset.tool === tool));
    const selBtn = document.getElementById("selectToolBtn");
    if (selBtn) selBtn.classList.toggle("active", tool === "select");
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (isRejectedTouch(e)) return;
    canvas.setPointerCapture(e.pointerId);
    const { x, y } = cellFromEvent(e);

    if (state.tool === "select") {
      if (inSelection(x, y)) {
        pushHistory();
        const s = state.selection;
        moveBuffer = { x0: s.x0, y0: s.y0, w: s.x1 - s.x0 + 1, h: s.y1 - s.y0 + 1, data: [] };
        for (let yy = s.y0; yy <= s.y1; yy++) {
          const row = [];
          for (let xx = s.x0; xx <= s.x1; xx++) { row.push(state.colorGrid[yy][xx]); state.colorGrid[yy][xx] = null; }
          moveBuffer.data.push(row);
        }
        moveOffset = { dx: 0, dy: 0 };
        selDragStart = { x, y, mode: "move" };
      } else {
        selDragStart = { x, y, mode: "new" };
        state.selection = { x0: x, y0: y, x1: x, y1: y };
      }
      drawGridToCanvas();
      return;
    }
    if (state.tool === "line" || state.tool === "rect") {
      pushHistory();
      shapeStart = { x, y }; shapeCur = { x, y };
      drawGridToCanvas();
      return;
    }
    pushHistory();
    painting = true;
    paintAt(x, y);
    drawGridToCanvas();
  });

  canvas.addEventListener("pointermove", (e) => {
    if (isRejectedTouch(e)) return;
    const { x, y } = cellFromEvent(e);
    if (state.tool === "select" && selDragStart) {
      if (selDragStart.mode === "new") {
        state.selection = { x0: Math.min(selDragStart.x, x), y0: Math.min(selDragStart.y, y), x1: Math.max(selDragStart.x, x), y1: Math.max(selDragStart.y, y) };
      } else if (selDragStart.mode === "move") {
        moveOffset = { dx: x - selDragStart.x, dy: y - selDragStart.y };
      }
      drawGridToCanvas();
      return;
    }
    if ((state.tool === "line" || state.tool === "rect") && shapeStart) {
      shapeCur = { x, y };
      drawGridToCanvas();
      return;
    }
    if (painting) { paintAt(x, y); drawGridToCanvas(); }
  });

  canvas.addEventListener("pointerup", (e) => {
    if (state.tool === "select" && selDragStart) {
      if (selDragStart.mode === "move" && moveBuffer) {
        const { w: gw, h: gh } = gridDims();
        for (let ry = 0; ry < moveBuffer.h; ry++) for (let rx = 0; rx < moveBuffer.w; rx++) {
          const val = moveBuffer.data[ry][rx];
          if (val == null) continue;
          const nx = moveBuffer.x0 + rx + moveOffset.dx, ny = moveBuffer.y0 + ry + moveOffset.dy;
          if (nx >= 0 && ny >= 0 && nx < gw && ny < gh) setCell(nx, ny, val);
        }
        state.selection = { x0: moveBuffer.x0 + moveOffset.dx, y0: moveBuffer.y0 + moveOffset.dy, x1: moveBuffer.x0 + moveOffset.dx + moveBuffer.w - 1, y1: moveBuffer.y0 + moveOffset.dy + moveBuffer.h - 1 };
        moveBuffer = null; moveOffset = { dx: 0, dy: 0 };
      }
      selDragStart = null;
      drawGridToCanvas();
      return;
    }
    if ((state.tool === "line" || state.tool === "rect") && shapeStart) {
      if (state.tool === "line") {
        bresenhamLine(shapeStart.x, shapeStart.y, shapeCur.x, shapeCur.y).forEach(([x, y]) => applyBrush(x, y, state.color));
      } else {
        const x0 = Math.min(shapeStart.x, shapeCur.x), x1 = Math.max(shapeStart.x, shapeCur.x);
        const y0 = Math.min(shapeStart.y, shapeCur.y), y1 = Math.max(shapeStart.y, shapeCur.y);
        for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
          if (!state.rectFilled && x !== x0 && x !== x1 && y !== y0 && y !== y1) continue;
          setCell(x, y, state.color);
        }
      }
      shapeStart = null; shapeCur = null;
      drawGridToCanvas();
      return;
    }
    painting = false;
  });
  canvas.addEventListener("pointercancel", () => { painting = false; selDragStart = null; shapeStart = null; });

  document.querySelectorAll(".tool-btn").forEach((btn) => {
    btn.addEventListener("click", () => { setToolUI(btn.dataset.tool); });
  });
  const selectBtn = document.getElementById("selectToolBtn");
  if (selectBtn) selectBtn.addEventListener("click", () => { state.tool = "select"; renderApp(); });

  document.getElementById("undoBtn").addEventListener("click", () => {
    const prev = state.history.pop();
    if (prev) { state.colorGrid = prev; drawGridToCanvas(); }
  });

  const colorPicker = document.getElementById("colorPicker");
  const colorHex = document.getElementById("colorHex");
  colorPicker.addEventListener("input", () => { state.color = colorPicker.value; colorHex.value = colorPicker.value; });
  colorHex.addEventListener("input", () => { state.color = colorHex.value; });

  document.getElementById("saveSwatchBtn").addEventListener("click", () => {
    if (!state.swatches.includes(state.color)) {
      state.swatches = [state.color, ...state.swatches].slice(0, 16);
      document.getElementById("swatchGrid").innerHTML = state.swatches.map((c) => `<button class="swatch" data-color="${c}" style="background:${c}"></button>`).join("");
      bindSwatchClicks();
    }
  });
  function bindSwatchClicks() {
    document.querySelectorAll(".swatch").forEach((s) => {
      s.addEventListener("click", () => { state.color = s.dataset.color; colorPicker.value = s.dataset.color; colorHex.value = s.dataset.color; });
    });
  }
  bindSwatchClicks();

  const brushRange = document.getElementById("brushRange");
  brushRange.addEventListener("input", () => { state.brushSize = Number(brushRange.value); document.getElementById("brushLabel").textContent = state.brushSize; });
  document.getElementById("mirrorCheck").addEventListener("change", (e) => { state.mirrorX = e.target.checked; });
  const rectFilledCheck = document.getElementById("rectFilledCheck");
  if (rectFilledCheck) rectFilledCheck.addEventListener("change", (e) => { state.rectFilled = e.target.checked; });

  const selFillBtn = document.getElementById("selFillBtn");
  if (selFillBtn) selFillBtn.addEventListener("click", () => {
    if (!state.selection) return;
    pushHistory();
    const s = state.selection;
    for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) setCell(x, y, state.color);
    drawGridToCanvas();
  });
  const selDeleteBtn = document.getElementById("selDeleteBtn");
  if (selDeleteBtn) selDeleteBtn.addEventListener("click", () => {
    if (!state.selection) return;
    pushHistory();
    const s = state.selection;
    for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) setCell(x, y, null);
    drawGridToCanvas();
  });
  const selDeselectBtn = document.getElementById("selDeselectBtn");
  if (selDeselectBtn) selDeselectBtn.addEventListener("click", () => { state.selection = null; renderApp(); });

  const detailRange = document.getElementById("detailRange");
  const detailLabel = document.getElementById("detailLabel");
  detailRange.addEventListener("input", () => {
    state.targetW = Number(detailRange.value);
    const { w, h } = gridDims();
    const targetH = Math.max(1, Math.round(h * (state.targetW / w)));
    detailLabel.textContent = `Target width: ${state.targetW}px \u2192 ${state.targetW}\u00d7${targetH}`;
  });
  document.getElementById("applyDetailBtn").addEventListener("click", () => {
    const { w, h } = gridDims();
    const targetH = Math.max(1, Math.round(h * (state.targetW / w)));
    applyResample(state.targetW, targetH);
  });

  drawGridToCanvas();
}

function posterize(v, levels) {
  const step = 255 / (levels - 1);
  return Math.round(Math.round(v / step) * step);
}
function pixelateImage(img) {
  const aspect = img.naturalHeight / img.naturalWidth;
  const w = state.importTargetW, h = Math.max(1, Math.round(w * aspect));
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const ctx = off.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h);
  const grid = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = posterize(data.data[i], state.colorLevels);
      const g = posterize(data.data[i+1], state.colorLevels);
      const b = posterize(data.data[i+2], state.colorLevels);
      row.push(`#${r.toString(16).padStart(2,"0")}${g.toString(16).padStart(2,"0")}${b.toString(16).padStart(2,"0")}`);
    }
    grid.push(row);
  }
  if (state.removeBg) {
    const isClose = (c1, c2, tol) => {
      const p = (h2) => [parseInt(h2.slice(1,3),16), parseInt(h2.slice(3,5),16), parseInt(h2.slice(5,7),16)];
      const [r1,g1,b1] = p(c1), [r2,g2,b2] = p(c2);
      return Math.abs(r1-r2)<=tol && Math.abs(g1-g2)<=tol && Math.abs(b1-b2)<=tol;
    };
    const bg = grid[0][0];
    const stack = [];
    for (let x=0;x<w;x++){ if(isClose(grid[0][x],bg,20)) stack.push([x,0]); if(isClose(grid[h-1][x],bg,20)) stack.push([x,h-1]); }
    for (let y=0;y<h;y++){ if(isClose(grid[y][0],bg,20)) stack.push([0,y]); if(isClose(grid[y][w-1],bg,20)) stack.push([w-1,y]); }
    const visited = Array.from({ length: h }, () => new Array(w).fill(false));
    while (stack.length) {
      const [x, y] = stack.pop();
      if (x<0||y<0||x>=w||y>=h||visited[y][x]) continue;
      if (!isClose(grid[y][x], bg, 20)) continue;
      visited[y][x] = true; grid[y][x] = null;
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
  }
  return grid;
}
function drawPreviewCanvas() {
  const canvas = document.getElementById("previewCanvas");
  if (!canvas || !state.previewGrid) return;
  const ctx = canvas.getContext("2d");
  const w = state.previewGrid[0].length, h = state.previewGrid.length;
  ctx.clearRect(0,0,w*IMPORT_CELL,h*IMPORT_CELL);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const c = state.previewGrid[y][x];
    ctx.fillStyle = c ? c : ((x+y)%2===0 ? "#232228" : "#1c1b21");
    ctx.fillRect(x*IMPORT_CELL,y*IMPORT_CELL,IMPORT_CELL,IMPORT_CELL);
  }
}
function setupImportTab() {
  if (!state.imgUrl) {
    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { state.imgUrl = reader.result; state.previewGrid = null; renderApp(); };
      reader.readAsDataURL(file);
    });
    return;
  }
  if (state.previewGrid) {
    drawPreviewCanvas();
    document.getElementById("useSpriteBtn").addEventListener("click", () => {
      replaceSprite(state.previewGrid);
      state.imgUrl = null; state.previewGrid = null;
      state.mode = "draw";
      renderApp();
    });
    document.getElementById("tryAnotherBtn").addEventListener("click", () => {
      state.imgUrl = null; state.previewGrid = null; renderApp();
    });
  } else {
    const img = document.getElementById("refImg");
    const doPixelate = () => { state.previewGrid = pixelateImage(img); renderApp(); };
    if (img.complete && img.naturalWidth > 0) doPixelate();
    else img.addEventListener("load", doPixelate);
  }

  const widthRange = document.getElementById("widthRange");
  const widthLabel = document.getElementById("widthLabel");
  widthRange.addEventListener("input", () => { state.importTargetW = Number(widthRange.value); widthLabel.textContent = `Pixel width (quality): ${state.importTargetW}`; });
  const levelsRange = document.getElementById("levelsRange");
  const levelsLabel = document.getElementById("levelsLabel");
  levelsRange.addEventListener("input", () => { state.colorLevels = Number(levelsRange.value); levelsLabel.textContent = `Color levels: ${state.colorLevels}`; });
  document.getElementById("removeBgCheck").addEventListener("change", (e) => { state.removeBg = e.target.checked; });
  document.getElementById("rerenderBtn").addEventListener("click", () => {
    const img = document.getElementById("refImg") || (() => { const i = new Image(); i.src = state.imgUrl; return i; })();
    if (img.complete && img.naturalWidth > 0) { state.previewGrid = pixelateImage(img); renderApp(); }
    else img.addEventListener("load", () => { state.previewGrid = pixelateImage(img); renderApp(); });
  });
}

function computeOwnerAndBBox() {
  const { w: gridW, h: gridH } = gridDims();
  const owner = Array.from({ length: gridH }, () => new Array(gridW).fill(null));
  const bbox = {};
  for (let y = 0; y < gridH; y++) for (let x = 0; x < gridW; x++) {
    if (!state.colorGrid[y][x]) continue;
    const key = x + "," + y;
    const boneId = state.overrides[key] || nearestBoneId(x, y, state.bones);
    owner[y][x] = boneId;
    if (!bbox[boneId]) bbox[boneId] = { minX: x, maxX: x, minY: y, maxY: y };
    else {
      const b = bbox[boneId];
      if (x < b.minX) b.minX = x; if (x > b.maxX) b.maxX = x;
      if (y < b.minY) b.minY = y; if (y > b.maxY) b.maxY = y;
    }
  }
  return { owner, bbox };
}

function renderPoseSnapped(ctx, poseAngles, gridW, gridH, owner, bbox, world) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  for (const boneId of BONE_ORDER) {
    const bb = bbox[boneId];
    if (!bb) continue;
    const rp = state.bones[boneId].pivot;
    const flip = !!state.bones[boneId].flip;
    const wt = world[boneId];
    const cosA = Math.cos(wt.angle), sinA = Math.sin(wt.angle);
    const invCosA = Math.cos(-wt.angle), invSinA = Math.sin(-wt.angle);
    const corners = [[bb.minX,bb.minY],[bb.maxX+1,bb.minY],[bb.minX,bb.maxY+1],[bb.maxX+1,bb.maxY+1]];
    let dminX=Infinity,dmaxX=-Infinity,dminY=Infinity,dmaxY=-Infinity;
    for (const [sx,sy] of corners) {
      let lx = sx - rp.x, ly = sy - rp.y;
      if (flip) lx = -lx;
      const wx = wt.pivot.x + (lx*cosA - ly*sinA);
      const wy = wt.pivot.y + (lx*sinA + ly*cosA);
      if (wx<dminX) dminX=wx; if (wx>dmaxX) dmaxX=wx;
      if (wy<dminY) dminY=wy; if (wy>dmaxY) dmaxY=wy;
    }
    const x0 = Math.floor(dminX)-1, x1 = Math.ceil(dmaxX)+1;
    const y0 = Math.floor(dminY)-1, y1 = Math.ceil(dmaxY)+1;
    for (let dy=y0; dy<y1; dy++) for (let dx=x0; dx<x1; dx++) {
      const wx = dx+0.5-wt.pivot.x, wy = dy+0.5-wt.pivot.y;
      let lx = wx*invCosA - wy*invSinA;
      const ly = wx*invSinA + wy*invCosA;
      if (flip) lx = -lx;
      const sx = Math.round(rp.x + lx - 0.5);
      const sy = Math.round(rp.y + ly - 0.5);
      if (sx<0||sy<0||sx>=gridW||sy>=gridH) continue;
      if (owner[sy][sx] !== boneId) continue;
      ctx.fillStyle = state.colorGrid[sy][sx];
      ctx.fillRect(RIG_PAD+dx*RIG_CELL, RIG_PAD+dy*RIG_CELL, RIG_CELL, RIG_CELL);
    }
  }
}

function drawSkeletonOverlay(ctx) {
  ctx.save();
  ctx.translate(RIG_PAD, RIG_PAD);
  for (const id of BONE_ORDER) {
    const bn = state.bones[id], meta = BONE_META[id];
    const sel = state.selectedBone === id;
    ctx.strokeStyle = meta.color; ctx.lineWidth = sel?3:1.5; ctx.globalAlpha = sel?1:0.55;
    ctx.beginPath(); ctx.moveTo(bn.pivot.x*RIG_CELL, bn.pivot.y*RIG_CELL); ctx.lineTo(bn.tip.x*RIG_CELL, bn.tip.y*RIG_CELL); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = meta.color;
    ctx.beginPath(); ctx.arc(bn.pivot.x*RIG_CELL, bn.pivot.y*RIG_CELL, sel?7:4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#111014"; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(bn.tip.x*RIG_CELL, bn.tip.y*RIG_CELL, sel?5:3, 0, Math.PI*2);
    ctx.fillStyle = "#111014"; ctx.fill();
    ctx.strokeStyle = meta.color; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}
function drawRegionOverlay(ctx, owner) {
  const { w: gridW, h: gridH } = gridDims();
  ctx.save();
  ctx.translate(RIG_PAD, RIG_PAD);
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = BONE_META[state.selectedBone].color;
  for (let y=0;y<gridH;y++) for (let x=0;x<gridW;x++) {
    if (owner[y][x] !== state.selectedBone) continue;
    ctx.fillRect(x*RIG_CELL, y*RIG_CELL, RIG_CELL, RIG_CELL);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawGizmo(ctx, boneId, world) {
  const wp = world[boneId].pivot;
  const cx = RIG_PAD + wp.x*RIG_CELL, cy = RIG_PAD + wp.y*RIG_CELL;
  const rp = state.bones[boneId].pivot, rt = state.bones[boneId].tip;
  const restLen = Math.hypot(rt.x-rp.x, rt.y-rp.y)*RIG_CELL;
  const radius = Math.max(22, Math.min(70, restLen*0.8));
  ctx.save();
  ctx.strokeStyle = "#ffffff"; ctx.globalAlpha=0.85; ctx.lineWidth=1.5;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  const worldAngle = world[boneId].angle;
  const hx = cx + Math.cos(worldAngle)*radius, hy = cy + Math.sin(worldAngle)*radius;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(hx,hy); ctx.strokeStyle=BONE_META[boneId].color; ctx.globalAlpha=0.9; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(hx,hy,7,0,Math.PI*2); ctx.fillStyle=BONE_META[boneId].color; ctx.globalAlpha=1; ctx.fill();
  ctx.strokeStyle="#111014"; ctx.lineWidth=2; ctx.stroke();
  const ix = cx+28, iy = cy-28;
  ctx.beginPath(); ctx.arc(ix,iy,13,0,Math.PI*2); ctx.fillStyle="#232228"; ctx.fill();
  ctx.strokeStyle="#ffffff"; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle="#ffffff"; ctx.font="13px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("\u21c4", ix, iy+1);
  ctx.restore();
}

function drawRigCanvas() {
  const canvas = document.getElementById("rigCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const { w: gridW, h: gridH } = gridDims();
  const { owner, bbox } = computeOwnerAndBBox();
  if (state.rigMode === "skeleton") {
    const world = computeWorldTransforms(state.bones, zeroPose());
    renderPoseSnapped(ctx, zeroPose(), gridW, gridH, owner, bbox, world);
    drawSkeletonOverlay(ctx);
  } else if (state.rigMode === "paint") {
    const world = computeWorldTransforms(state.bones, zeroPose());
    renderPoseSnapped(ctx, zeroPose(), gridW, gridH, owner, bbox, world);
    drawRegionOverlay(ctx, owner);
  } else {
    const world = computeWorldTransforms(state.bones, state.pose);
    renderPoseSnapped(ctx, state.pose, gridW, gridH, owner, bbox, world);
    if (state.selectedBone) drawGizmo(ctx, state.selectedBone, world);
  }
}

function hitTestBoneAtPose(x, y, world) {
  const { owner } = computeOwnerAndBBox();
  const { w: gridW, h: gridH } = gridDims();
  for (let i = BONE_ORDER.length - 1; i >= 0; i--) {
    const boneId = BONE_ORDER[i];
    const rp = state.bones[boneId].pivot;
    const flip = !!state.bones[boneId].flip;
    const wt = world[boneId];
    const cosA = Math.cos(-wt.angle), sinA = Math.sin(-wt.angle);
    let lx = (x - wt.pivot.x) * cosA - (y - wt.pivot.y) * sinA;
    const ly = (x - wt.pivot.x) * sinA + (y - wt.pivot.y) * cosA;
    if (flip) lx = -lx;
    const sx = Math.round(rp.x + lx - 0.5), sy = Math.round(rp.y + ly - 0.5);
    if (sx < 0 || sy < 0 || sx >= gridW || sy >= gridH) continue;
    if (owner[sy][sx] === boneId) return boneId;
  }
  return null;
}

function syncPoseSlidersUI() {
  if (state.rigMode !== "pose") return;
  for (const id of BONE_ORDER) {
    if (id === "torso") continue;
    const slider = document.querySelector(`.pose-range[data-bone="${id}"]`);
    const label = document.getElementById(`poseVal_${id}`);
    if (slider) slider.value = state.pose[id] || 0;
    if (label) label.textContent = `${Math.round(state.pose[id]||0)}\u00b0`;
    const flipInput = document.querySelector(`.flip-check-input[data-bone="${id}"]`);
    if (flipInput) flipInput.checked = !!state.bones[id].flip;
  }
  const timeLabel = document.getElementById("timeLabel");
  if (timeLabel) timeLabel.textContent = `${state.playhead.toFixed(2)}s`;
  const ph = document.getElementById("tlPlayhead");
  if (ph) {
    const trackEnd = Math.max(state.duration, getLastKfTime(), 0.1);
    ph.style.left = (state.playhead / trackEnd * 100) + "%";
  }
  refreshUnsavedIndicator();
}
function refreshUnsavedIndicator() {
  const btn = document.getElementById("addKfBtn");
  if (btn) btn.classList.toggle("pulse", hasUnsavedPoseChanges());
}

function refreshPlayButton() {
  const btn = document.getElementById("playBtn");
  if (btn) btn.innerHTML = state.playing ? "&#10073;&#10073;" : "&#9654;";
}

function startPlayback() {
  state.playing = true;
  state.playhead = 0;
  refreshPlayButton();
  const startPerf = performance.now();
  function tick(now) {
    const raw = (now - startPerf) / 1000;
    const lastT = getLastKfTime();
    let t;
    if (state.loopMode === "loop") {
      t = state.duration > 0 ? (raw % state.duration) : 0;
      applyPoseAtTimeLooping(t);
    } else if (state.loopMode === "once") {
      t = Math.min(raw, lastT);
      applyPoseAtTime(t);
      state.playhead = t;
      drawRigCanvas();
      syncPoseSlidersUI();
      if (raw >= lastT) { stopPlayback(); refreshPlayButton(); return; }
      state.rafId = requestAnimationFrame(tick);
      return;
    } else {
      const cycle = lastT > 0 ? lastT * 2 : 0.0001;
      const phase = raw % cycle;
      t = phase <= lastT ? phase : cycle - phase;
      applyPoseAtTime(t);
    }
    state.playhead = t;
    drawRigCanvas();
    syncPoseSlidersUI();
    state.rafId = requestAnimationFrame(tick);
  }
  state.rafId = requestAnimationFrame(tick);
}
function stopPlayback() {
  state.playing = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.rafId = null;
}
function scrub(t) {
  stopPlayback();
  refreshPlayButton();
  state.playhead = Math.max(0, t);
  applyPoseAtTime(state.playhead);
  syncPoseSlidersUI();
  drawRigCanvas();
}

function setupRigTab() {
  const canvas = document.getElementById("rigCanvas");
  let dragRef = null;

  document.querySelectorAll(".rigmode-btn").forEach((btn) => {
    btn.addEventListener("click", () => { stopPlayback(); state.rigMode = btn.dataset.rigmode; renderApp(); });
  });
  document.getElementById("autoRigBtn").addEventListener("click", () => {
    state.bones = autoRigBones(state.colorGrid);
    state.overrides = {};
    drawRigCanvas();
  });
  document.querySelectorAll(".bone-item").forEach((btn) => {
    btn.addEventListener("click", () => { state.selectedBone = btn.dataset.bone; renderApp(); });
  });
  const clearBtn = document.getElementById("clearOverridesBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => {
    for (const k of Object.keys(state.overrides)) if (state.overrides[k] === state.selectedBone) delete state.overrides[k];
    drawRigCanvas();
  });

  function toGrid(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    const px = (e.clientX - rect.left) * scaleX - RIG_PAD;
    const py = (e.clientY - rect.top) * scaleY - RIG_PAD;
    return { x: px / RIG_CELL, y: py / RIG_CELL };
  }
  function toCanvasPx(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }
  function paintCell(xf, yf) {
    const { w: gridW, h: gridH } = gridDims();
    const x = Math.floor(xf), y = Math.floor(yf);
    if (x<0||y<0||x>=gridW||y>=gridH || !state.colorGrid[y][x]) return;
    state.overrides[x+","+y] = state.selectedBone;
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (isRejectedTouch(e)) return;
    canvas.setPointerCapture(e.pointerId);
    if (state.rigMode === "skeleton") {
      const { x, y } = toGrid(e);
      let best = null, bestD = 16 / RIG_CELL;
      for (const id of BONE_ORDER) {
        const bn = state.bones[id];
        const dPiv = Math.hypot(x-bn.pivot.x, y-bn.pivot.y);
        const dTip = Math.hypot(x-bn.tip.x, y-bn.tip.y);
        if (dPiv < bestD) { bestD = dPiv; best = { boneId:id, part:"pivot" }; }
        if (dTip < bestD) { bestD = dTip; best = { boneId:id, part:"tip" }; }
      }
      if (best) {
        dragRef = best;
        if (state.selectedBone !== best.boneId) { state.selectedBone = best.boneId; renderApp(); }
      }
    } else if (state.rigMode === "paint") {
      const { x, y } = toGrid(e);
      paintCell(x, y);
      dragRef = { painting: true };
      drawRigCanvas();
    } else if (state.rigMode === "pose") {
      const world = computeWorldTransforms(state.bones, state.pose);
      if (state.selectedBone) {
        const wp = world[state.selectedBone].pivot;
        const iconX = RIG_PAD + wp.x*RIG_CELL + 28, iconY = RIG_PAD + wp.y*RIG_CELL - 28;
        const pt = toCanvasPx(e);
        if (Math.hypot(pt.x-iconX, pt.y-iconY) < 16) {
          state.bones[state.selectedBone].flip = !state.bones[state.selectedBone].flip;
          drawRigCanvas();
          refreshUnsavedIndicator();
          syncPoseSlidersUI();
          dragRef = null;
          return;
        }
      }
      const { x, y } = toGrid(e);
      const hit = hitTestBoneAtPose(x, y, world);
      if (hit) {
        state.selectedBone = hit;
        dragRef = { rotating: true, boneId: hit };
        drawRigCanvas();
      } else {
        dragRef = null;
      }
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (isRejectedTouch(e)) return;
    if (!dragRef) return;
    if (state.rigMode === "skeleton" && dragRef.boneId) {
      const { x, y } = toGrid(e);
      state.bones[dragRef.boneId][dragRef.part] = { x, y };
      drawRigCanvas();
    } else if (state.rigMode === "paint" && dragRef.painting) {
      const { x, y } = toGrid(e);
      paintCell(x, y);
      drawRigCanvas();
    } else if (state.rigMode === "pose" && dragRef.rotating) {
      const { x, y } = toGrid(e);
      const boneId = dragRef.boneId;
      const world = computeWorldTransforms(state.bones, state.pose);
      const parentId = BONE_META[boneId].parent;
      const parentWorldAngle = parentId ? world[parentId].angle : 0;
      const rp = state.bones[boneId].pivot, rt = state.bones[boneId].tip;
      const restAngle = Math.atan2(rt.y-rp.y, rt.x-rp.x);
      const wp = world[boneId].pivot;
      const desiredWorldAngle = Math.atan2(y-wp.y, x-wp.x);
      let localAngle = desiredWorldAngle - restAngle - parentWorldAngle;
      while (localAngle > Math.PI) localAngle -= 2*Math.PI;
      while (localAngle < -Math.PI) localAngle += 2*Math.PI;
      state.pose[boneId] = localAngle * 180 / Math.PI;
      drawRigCanvas();
      syncPoseSlidersUI();
    }
  });

  canvas.addEventListener("pointerup", () => { dragRef = null; });
  canvas.addEventListener("pointercancel", () => { dragRef = null; });

  if (state.rigMode === "pose") {
    document.querySelectorAll(".pose-range").forEach((slider) => {
      slider.addEventListener("input", () => {
        const id = slider.dataset.bone;
        state.pose[id] = Number(slider.value);
        document.getElementById(`poseVal_${id}`).textContent = `${Math.round(state.pose[id])}\u00b0`;
        drawRigCanvas();
        refreshUnsavedIndicator();
      });
    });
    document.querySelectorAll(".flip-check-input").forEach((chk) => {
      chk.addEventListener("change", () => {
        state.bones[chk.dataset.bone].flip = chk.checked;
        drawRigCanvas();
        refreshUnsavedIndicator();
      });
    });
    document.getElementById("resetPoseBtn").addEventListener("click", () => {
      state.pose = zeroPose();
      for (const id of BONE_ORDER) state.bones[id].flip = false;
      syncPoseSlidersUI();
      drawRigCanvas();
    });
    document.getElementById("playBtn").addEventListener("click", () => {
      if (state.playing) { stopPlayback(); refreshPlayButton(); } else { startPlayback(); }
    });
    document.getElementById("loopModeBtn").addEventListener("click", () => {
      const order = ["loop", "boomerang", "once"];
      state.loopMode = order[(order.indexOf(state.loopMode) + 1) % order.length];
      renderApp();
    });
    document.getElementById("addKfBtn").addEventListener("click", () => {
      const t = Math.round(state.playhead * 100) / 100;
      state.keyframes = state.keyframes.filter((k) => Math.abs(k.t - t) > 0.001);
      const flipSnap = {}; for (const id of BONE_ORDER) flipSnap[id] = !!state.bones[id].flip;
      state.keyframes.push({ t, pose: { ...state.pose }, flip: flipSnap });
      state.keyframes.sort((a,b)=>a.t-b.t);
      renderApp();
    });
    document.querySelectorAll("[data-dur-adj]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.duration = Math.max(0.2, Math.round((state.duration + Number(btn.dataset.durAdj)) * 10) / 10);
        document.getElementById("durVal").textContent = state.duration.toFixed(1) + "s";
        renderApp();
      });
    });

    const tlTrack = document.getElementById("tlTrack");
    let tlDrag = null;
    tlTrack.addEventListener("pointerdown", (e) => {
      if (isRejectedTouch(e)) return;
      tlTrack.setPointerCapture(e.pointerId);
      const marker = e.target.closest(".tl-marker");
      const trackEnd = Math.max(state.duration, getLastKfTime(), 0.1);
      if (marker) {
        tlDrag = { kfIndex: Number(marker.dataset.index), trackEnd };
        return;
      }
      const rect = tlTrack.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      scrub(frac * trackEnd);
      tlDrag = { scrubbing: true, trackEnd };
    });
    tlTrack.addEventListener("pointermove", (e) => {
      if (isRejectedTouch(e) || !tlDrag) return;
      const rect = tlTrack.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      if (tlDrag.scrubbing) {
        scrub(frac * tlDrag.trackEnd);
      } else if (tlDrag.kfIndex !== undefined) {
        const newT = Math.round(frac * tlDrag.trackEnd * 100) / 100;
        state.keyframes[tlDrag.kfIndex].t = newT;
        const markerEl = document.querySelector(`.tl-marker[data-index="${tlDrag.kfIndex}"]`);
        if (markerEl) markerEl.style.left = (newT / tlDrag.trackEnd * 100) + "%";
      }
    });
    tlTrack.addEventListener("pointerup", () => {
      if (tlDrag && tlDrag.kfIndex !== undefined) {
        state.keyframes.sort((a,b)=>a.t-b.t);
        renderApp();
      }
      tlDrag = null;
    });
    tlTrack.addEventListener("pointercancel", () => { tlDrag = null; });
  }

  drawRigCanvas();
  if (state.rigMode === "pose") refreshUnsavedIndicator();
}

/* ---------- boot ---------- */
renderApp();
</script>
</body>
</html>
