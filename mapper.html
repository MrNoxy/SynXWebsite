<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm LLC - Custom Sitemap Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121214; color: #e1e1e6; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #fff; border-bottom: 1px solid #29292e; padding-bottom: 10px; }
        .input-group { background: #202024; padding: 15px; border-radius: 6px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        input, select, button, textarea { background: #121214; color: #fff; border: 1px solid #29292e; padding: 10px; border-radius: 4px; font-size: 14px; }
        input[type="text"] { flex-grow: 1; }
        button { background: #04d361; color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #02b852; }
        button.secondary { background: #4e4e54; color: #fff; }
        button.secondary:hover { background: #3e3e42; }
        ul { list-style: none; padding: 0; }
        li { background: #202024; padding: 10px 15px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .remove-btn { background: #ea5353; border: none; padding: 5px 10px; cursor: pointer; color: #fff; border-radius: 3px; }
        textarea { width: 100%; height: 300px; font-family: monospace; background: #0d0d0f; margin-top: 15px; box-sizing: border-box; }
        #status { font-weight: bold; color: #ffcd1e; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Custom Sitemap Generator</h1>
    <p>Add your main landing pages and assign their priorities. Sub-pages found inside them will automatically inherit a slightly lower priority status.</p>

    <!-- Form to add seed links -->
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="e.g., /v3 or https://synapse-x.to/krnl">
        <select id="priorityInput">
            <option value="1.0">1.0 (Highest)</option>
            <option value="0.9">0.9</option>
            <option value="0.8" selected>0.8 (High)</option>
            <option value="0.7">0.7</option>
            <option value="0.6">0.6 (Standard)</option>
            <option value="0.5">0.5</option>
        </select>
        <button onclick="addSeedLink()">Add Page</button>
    </div>

    <h3>Target Pages to Crawl:</h3>
    <ul id="linkList"></ul>

    <button class="secondary" style="width: 100%; padding: 15px;" onclick="startCrawl()">Run Crawler & Generate Sitemap</button>

    <div id="status"></div>
    <textarea id="output" placeholder="Your sitemap.xml layout will appear here..."></textarea>

    <script>
        const seedLinks = [];
        const finalSitemapUrls = new Map(); // Stores URL -> Priority

        function addSeedLink() {
            let url = document.getElementById('urlInput').value.trim();
            const priority = document.getElementById('priorityInput').value;

            if (!url) return;

            // Clean up relative paths if typed without origin
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                const origin = window.location.origin;
                url = origin + (url.startsWith('/') ? '' : '/') + url;
            }

            seedLinks.push({ url, priority: parseFloat(priority) });
            document.getElementById('urlInput').value = '';
            renderList();
        }

        function removeLink(index) {
            seedLinks.splice(index, 1);
            renderList();
        }

        function renderList() {
            const list = document.getElementById('linkList');
            list.innerHTML = '';
            seedLinks.forEach((item, index) => {
                list.innerHTML += `<li>
                    <span><strong>[Priority ${item.priority}]</strong> ${item.url}</span>
                    <button class="remove-btn" onclick="removeLink(${index})">Remove</button>
                </li>`;
            });
        }

        async function startCrawl() {
            if (seedLinks.length === 0) {
                alert("Please add at least one main page first!");
                return;
            }

            const statusDiv = document.getElementById('status');
            const outputTextArea = document.getElementById('output');
            finalSitemapUrls.clear();
            outputTextArea.value = '';

            // Map base origin to prevent escaping to external sites
            const origin = window.location.origin;

            for (const seed of seedLinks) {
                statusDiv.innerText = `Crawling target: ${seed.url}...`;
                
                // Add the main seed link itself
                finalSitemapUrls.set(seed.url, seed.priority);

                try {
                    const response = await fetch(seed.url);
                    if (!response.ok) throw new Error("Could not fetch page status");
                    
                    const htmlText = await response.text();
                    
                    // Parse HTML string to scan for links
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const anchors = doc.querySelectorAll('a[href]');

                    anchors.forEach(a => {
                        let href = a.getAttribute('href').trim();
                        
                        // Convert relative paths to absolute URLs
                        if (!href.startsWith('http://') && !href.startsWith('https://')) {
                            href = origin + (href.startsWith('/') ? '' : '/') + href;
                        }

                        // Ensure it stays on your domain and ignore anchors (#) or queries (?)
                        let cleanUrl = href.split('#')[0].split('?')[0];
                        if (cleanUrl.endsWith('/')) cleanUrl = cleanUrl.slice(0, -1); // standardize trailing slash

                        if (cleanUrl.startsWith(origin) && !finalSitemapUrls.has(cleanUrl)) {
                            // Automatically assign a slightly lower priority to child pages
                            let childPriority = Math.max(0.3, seed.priority - 0.1).toFixed(1);
                            finalSitemapUrls.set(cleanUrl, parseFloat(childPriority));
                        }
                    });

                } catch (err) {
                    console.error(`Failed crawling ${seed.url}:`, err);
                    statusDiv.innerText = `Skipped/Error on: ${seed.url} (Are you running this from the live domain?)`;
                }
            }

            statusDiv.innerText = "Processing completed! Sitemap compiled below.";
            buildXmlOutput();
        }

        function buildXmlOutput() {
            const today = new Date().toISOString().split('T')[0];
            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

            finalSitemapUrls.forEach((priority, url) => {
                xml += `  <url>\n`;
                xml += `    <loc>${url}</loc>\n`;
                xml += `    <lastmod>${today}</lastmod>\n`;
                xml += `    <changefreq>weekly</changefreq>\n`;
                xml += `    <priority>${priority.toFixed(1)}</priority>\n`;
                xml += `  </url>\n`;
            });

            xml += `</urlset>`;
            document.getElementById('output').value = xml;
        }
    </script>
</body>
</html>
