<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixEdit Ultimate v3</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root { --bg-color: #000; --panel-bg: #1c1c1e; --accent: #ff2a5f; --text: #fff; --text-muted: #8e8e93; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text); font-family: sans-serif; overscroll-behavior-y: none; padding-bottom: 80px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #333; }
        .top-bar h1 { font-size: 18px; margin: 0; }
        .btn-text { color: var(--accent); background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px; }

        .upload-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70vh; }
        .upload-screen label { background-color: var(--accent); color: #fff; padding: 15px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .upload-screen input[type="file"] { display: none; }

        .workspace { display: none; width: 100vw; height: calc(100vh - 140px); position: relative; overflow: hidden; background: #111;}
        #editorBox { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .cropper-wrapper { position: absolute; width: 100%; height: 100%; z-index: 1; }
        img { display: block; max-width: 100%; max-height: 100%; }
        
        #layerContainer { position: absolute; z-index: 5; pointer-events: none; transform-origin: 0 0; }
        .layer-item { position: absolute; pointer-events: auto; }
        .text-layer { font-weight: bold; white-space: nowrap; user-select: none; }
        .canvas-layer { position: absolute; top: 0; left: 0; pointer-events: auto; } 

        .menu-panel { display: none; padding: 15px; background-color: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); border-radius: 15px 15px 0 0; position: fixed; bottom: 60px; left: 0; width: 100%; box-sizing: border-box; z-index: 100; max-height: 65vh; overflow-y: auto; }
        .active-menu { display: block; }
        .menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .menu-title { font-size: 14px; color: var(--text-muted); margin: 0; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; padding: 0 10px; cursor: pointer; }

        .tool-row { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 5px; }
        .tool-btn { background: #333; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 12px; flex: 1; text-align: center; cursor: pointer;}
        
        .slider-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .slider-group label { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }

        .input-group { display: flex; flex-direction: column; margin-bottom: 10px; flex: 1;}
        .input-group label { font-size: 12px; margin-bottom: 4px; }
        .input-group input, .input-group select { padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: white; font-size: 16px; width: 100%; box-sizing: border-box;}

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--bg-color); display: flex; overflow-x: auto; border-top: 1px solid #333; padding: 10px 0; z-index: 120; }
        .nav-item { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); min-width: 65px; cursor: pointer; font-size: 10px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
        
        .layer-list-item { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px; border-radius: 5px; margin-bottom: 5px; font-size: 12px;}
        .layer-controls button { background: #444; color: white; border: none; padding: 5px 8px; border-radius: 3px; margin-left: 5px; }
        .layer-controls button.del { background: #ff2a5f; }

        #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px; display: none; z-index: 200; font-weight: bold; }
    </style>
</head>
<body>

<div id="toast">Message</div>

<div class="top-bar" id="topBar" style="display:none;">
    <button class="btn-text" style="color:var(--text-muted)" onclick="location.reload()">Reset</button>
    <h1>PixEdit</h1>
    <button class="btn-text" id="downloadBtn">Save</button>
</div>

<div class="upload-screen" id="uploadScreen">
    <h1 style="margin-bottom: 30px; font-size: 32px; letter-spacing: 2px;">PixEdit</h1>
    <label for="upload">+ Select Base Photo</label>
    <input type="file" id="upload" accept="image/*">
</div>

<div class="workspace" id="workspace">
    <div id="editorBox">
        <div class="cropper-wrapper" id="cropperWrapper">
            <img id="image" src="">
        </div>
        <div id="layerContainer"></div>
    </div>
</div>

<div class="menu-panel" id="menu-layers">
    <div class="menu-header"><p class="menu-title">Layers Panel</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    <div id="layerList"><i>No extra layers added yet.</i></div>
</div>

<div class="menu-panel" id="menu-tools">
    <div class="menu-header"><p class="menu-title">Crop & Resize</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    
    <label style="font-size: 12px; margin-bottom: 10px; display: block; color: var(--accent);">
        <input type="checkbox" id="lockRatio" checked> 🔗 Lock Aspect Ratio
    </label>
    <div class="tool-row" style="gap:10px;">
        <div class="input-group"><label>Width (px)</label><input type="number" id="resizeW"></div>
        <div class="input-group"><label>Height (px)</label><input type="number" id="resizeH"></div>
    </div>

    <div class="tool-row" style="margin-top: 15px;">
        <button class="tool-btn" onclick="if(cropper) cropper.rotate(-90)">↺ Left</button>
        <button class="tool-btn" onclick="if(cropper) cropper.rotate(90)">↻ Right</button>
    </div>
    <button class="tool-btn" style="width: 100%; background: #00e676; color: #000; font-weight: bold; margin-top: 10px;" onclick="applyBaseCrop()">✅ Apply Crop & Resize</button>
</div>

<div class="menu-panel" id="menu-text">
    <div class="menu-header"><p class="menu-title">Add Text Layer</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    <div class="input-group"><input type="text" id="textInput" placeholder="Enter text..."></div>
    <div class="tool-row">
        <div class="input-group"><label>Color</label><input type="color" id="textColor" value="#ffffff" style="height:40px;"></div>
        <div class="input-group"><label>Size</label><input type="number" id="textSize" value="100"></div>
    </div>
    <button class="tool-btn" style="background:var(--accent); width:100%;" onclick="addTextLayer()">+ Add Text</button>
    <p style="font-size: 10px; color:#aaa; text-align:center; margin-top:10px;">Double-tap added text to edit/resize it!</p>
</div>

<div class="menu-panel" id="menu-addphoto">
    <div class="menu-header"><p class="menu-title">Add Photo Layer</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    <label for="overlayUpload" style="background:var(--accent); padding:10px; display:block; text-align:center; border-radius:5px; margin-bottom:10px;">Select Extra Image</label>
    <input type="file" id="overlayUpload" accept="image/*" style="display:none;">
    <p style="font-size: 10px; color:#aaa; text-align:center;">Double-tap the added image to scale it!</p>
</div>

<div class="menu-panel" id="menu-draw">
    <div class="menu-header"><p class="menu-title">Draw / Erase Engine</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    
    <div class="input-group">
        <label>Active Target</label>
        <select id="drawTarget" onchange="setupDrawTarget()">
            <option value="none">-- Select Layer to Draw On --</option>
            <option value="new">Create New Draw Layer</option>
        </select>
    </div>

    <div class="tool-row">
        <div class="input-group"><label>Color</label><input type="color" id="drawColor" value="#ff2a5f" style="height:40px;"></div>
        <div class="input-group"><label>Size</label><input type="number" id="drawSize" value="20"></div>
    </div>
    
    <div class="tool-row">
        <button class="tool-btn" id="modeDraw" style="background:var(--accent);">🖌️ Brush</button>
        <button class="tool-btn" id="modeBlend">✨ Blend</button>
        <button class="tool-btn" id="modeErase">🧽 Erase</button>
    </div>
</div>

<div class="bottom-nav" id="bottomNav" style="display:none;">
    <div class="nav-item" onclick="toggleMenu('layers', this)"><span class="nav-icon">📚</span><span>Layers</span></div>
    <div class="nav-item" onclick="toggleMenu('tools', this)"><span class="nav-icon">✂️</span><span>Crop/Size</span></div>
    <div class="nav-item" onclick="toggleMenu('text', this)"><span class="nav-icon">Aa</span><span>Text</span></div>
    <div class="nav-item" onclick="toggleMenu('addphoto', this)"><span class="nav-icon">🖼️</span><span>Add Pic</span></div>
    <div class="nav-item" onclick="toggleMenu('draw', this)"><span class="nav-icon">🖌️</span><span>Draw</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    var uploadInput = document.getElementById('upload');
    var image = document.getElementById('image');
    var layerContainer = document.getElementById('layerContainer');
    var layerListUI = document.getElementById('layerList');
    
    var cropper;
    var layers = []; 
    var layerCounter = 0;
    
    // Resize Vars
    var resizeW = document.getElementById('resizeW');
    var resizeH = document.getElementById('resizeH');
    var lockRatio = document.getElementById('lockRatio');
    var currentAspectRatio = 1;

    // Draw Vars
    var isDrawing = false;
    var currentDrawCtx = null;
    var drawMode = 'source-over'; 
    var activeDrawCanvas = null;

    function showToast(msg) {
        var t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(function() { t.style.display = 'none'; }, 2000);
    }

    function syncLayers() {
        if(!cropper) return;
        var cData = cropper.getCanvasData();
        if(!cData || !cData.naturalWidth) return;
        var scale = cData.width / cData.naturalWidth;
        layerContainer.style.width = cData.naturalWidth + 'px';
        layerContainer.style.height = cData.naturalHeight + 'px';
        layerContainer.style.transform = 'translate(' + cData.left + 'px, ' + cData.top + 'px) scale(' + scale + ')';
    }

    function initCropper() {
        if (cropper) cropper.destroy();
        cropper = new Cropper(image, { 
            viewMode: 1, dragMode: 'move', autoCropArea: 0.8, responsive: true, background: false,
            ready: function() {
                cropper.clear(); 
                syncLayers();
                // Setup Resize inputs
                var data = cropper.getImageData();
                resizeW.value = Math.round(data.naturalWidth);
                resizeH.value = Math.round(data.naturalHeight);
                currentAspectRatio = data.naturalWidth / data.naturalHeight;
            },
            crop: function() { syncLayers(); },
            zoom: function() { setTimeout(syncLayers, 10); },
            cropend: function() {
                var data = cropper.getCropBoxData();
                // Estimate pixel size based on crop box vs canvas scale
                var scale = cropper.getImageData().naturalWidth / cropper.getCanvasData().width;
                resizeW.value = Math.round(data.width * scale);
                resizeH.value = Math.round(data.height * scale);
                currentAspectRatio = data.width / data.height;
            }
        });
    }

    uploadInput.addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (event) {
            document.getElementById('uploadScreen').style.display = 'none';
            document.getElementById('topBar').style.display = 'flex';
            document.getElementById('workspace').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
            image.src = event.target.result;
            initCropper();
        };
        reader.readAsDataURL(file);
    });

    // --- Menu Control ---
    function closeAllMenus() {
        var menus = document.querySelectorAll('.menu-panel');
        for (var i = 0; i < menus.length; i++) menus[i].classList.remove('active-menu');
        var navItems = document.querySelectorAll('.nav-item');
        for (var j = 0; j < navItems.length; j++) navItems[j].classList.remove('active');
        
        if(cropper) { cropper.clear(); cropper.setDragMode('move'); }
        
        // Disable drawing state when menus close
        activeDrawCanvas = null;
        currentDrawCtx = null;
    }

    function toggleMenu(menuName, element) {
        var targetMenu = document.getElementById('menu-' + menuName);
        var isActive = targetMenu.classList.contains('active-menu');
        closeAllMenus();
        
        if (!isActive) {
            targetMenu.classList.add('active-menu');
            element.classList.add('active');
            
            if (menuName === 'tools') {
                cropper.crop(); cropper.setDragMode('crop');
            } else if (menuName === 'draw') {
                cropper.setDragMode('none'); 
                populateDrawTargets();
            } else if (menuName === 'layers') {
                updateLayersUI();
            }
        }
    }

    // --- Resize Math ---
    resizeW.addEventListener('input', function() {
        if (lockRatio.checked && this.value) resizeH.value = Math.round(parseInt(this.value, 10) / currentAspectRatio);
    });
    resizeH.addEventListener('input', function() {
        if (lockRatio.checked && this.value) resizeW.value = Math.round(parseInt(this.value, 10) * currentAspectRatio);
    });

    function applyBaseCrop() {
        if(!cropper) return;
        var cropped = cropper.getCroppedCanvas();
        
        // Apply pixel resize
        var finalW = parseInt(resizeW.value) || cropped.width;
        var finalH = parseInt(resizeH.value) || cropped.height;
        var resizedCanvas = document.createElement('canvas');
        resizedCanvas.width = finalW;
        resizedCanvas.height = finalH;
        resizedCanvas.getContext('2d').drawImage(cropped, 0, 0, finalW, finalH);

        var dataURL = resizedCanvas.toDataURL('image/png');
        cropper.destroy();
        image.src = dataURL;
        image.onload = function() {
            initCropper();
            closeAllMenus();
            showToast("Cropped & Resized!");
        };
    }

    // --- LAYER SYSTEM & DOUBLE TAP EDIT ---
    function registerLayer(element, name, type) {
        layerCounter++;
        var id = 'layer_' + layerCounter;
        element.id = id;
        element.className += ' layer-item';
        element.style.zIndex = layerCounter;
        
        var cData = cropper.getCanvasData();
        element.style.left = (cData.naturalWidth / 2) + 'px';
        element.style.top = (cData.naturalHeight / 2) + 'px';
        element.style.transform = 'translate(-50%, -50%) scale(1)';
        element.setAttribute('data-scale', '1');
        
        layerContainer.appendChild(element);
        layers.push({ id: id, name: name + ' ' + layerCounter, el: element, type: type });
        makeDraggableAndEditable(element);
        showToast(name + " Added!");
        updateLayersUI();
    }

    function updateLayersUI() {
        if(layers.length === 0) { layerListUI.innerHTML = "<i>No extra layers added yet.</i>"; return; }
        layerListUI.innerHTML = '';
        for (var i = layers.length - 1; i >= 0; i--) {
            var l = layers[i];
            var div = document.createElement('div');
            div.className = 'layer-list-item';
            div.innerHTML = '<span>' + l.name + '</span>' +
                            '<div class="layer-controls">' +
                            '<button onclick="moveLayer(' + i + ', 1)">▲</button>' +
                            '<button onclick="moveLayer(' + i + ', -1)">▼</button>' +
                            '<button class="del" onclick="deleteLayer(' + i + ')">X</button>' +
                            '</div>';
            layerListUI.appendChild(div);
        }
    }

    function moveLayer(index, direction) {
        var targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= layers.length) return;
        var temp = layers[index];
        layers[index] = layers[targetIndex];
        layers[targetIndex] = temp;
        for (var i = 0; i < layers.length; i++) layers[i].el.style.zIndex = i + 1;
        updateLayersUI();
    }

    function deleteLayer(index) {
        layerContainer.removeChild(layers[index].el);
        layers.splice(index, 1);
        updateLayersUI();
    }

    function makeDraggableAndEditable(el) {
        var isDragging = false, startX, startY, initialX, initialY;
        var lastTap = 0;

        function startDrag(e) {
            // Block drag if we are actively drawing on THIS canvas
            if(activeDrawCanvas && activeDrawCanvas.id === el.id) return;
            
            isDragging = true;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            var style = window.getComputedStyle(el);
            var matrix = new WebKitCSSMatrix(style.transform);
            initialX = matrix.m41;
            initialY = matrix.m42;
            
            startX = clientX;
            startY = clientY;
            
            // Double Tap Detection
            var currentTime = new Date().getTime();
            var tapLength = currentTime - lastTap;
            if (tapLength < 400 && tapLength > 0) {
                isDragging = false;
                handleDoubleTapEdit(el);
                e.preventDefault();
            }
            lastTap = currentTime;
        }

        function doDrag(e) {
            if (!isDragging) return;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            var cData = cropper.getCanvasData();
            var scale = cData.width / cData.naturalWidth;
            
            var dx = (clientX - startX) / scale;
            var dy = (clientY - startY) / scale;
            
            var currentScale = el.getAttribute('data-scale') || 1;
            el.style.transform = 'translate(' + (initialX + dx) + 'px, ' + (initialY + dy) + 'px) scale(' + currentScale + ')';
            e.preventDefault();
        }
        function stopDrag() { isDragging = false; }
        
        el.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('mouseup', stopDrag);
        el.addEventListener('touchstart', startDrag, {passive: false});
        document.addEventListener('touchmove', doDrag, {passive: false});
        document.addEventListener('touchend', stopDrag);
    }

    function handleDoubleTapEdit(el) {
        if (el.classList.contains('text-layer')) {
            var newText = prompt("Edit your text:", el.innerText);
            if (newText !== null) el.innerText = newText;
            
            var currentSize = parseInt(el.style.fontSize);
            var newSize = prompt("Enter text size number:", currentSize);
            if (newSize && !isNaN(newSize)) el.style.fontSize = newSize + "px";
            
        } else if (el.tagName.toLowerCase() === 'canvas') {
            var currentScale = parseFloat(el.getAttribute('data-scale')) || 1;
            var newScale = prompt("Scale Image (e.g. 0.5 for half, 2 for double size):", currentScale);
            if (newScale && !isNaN(newScale)) {
                el.setAttribute('data-scale', newScale);
                var style = window.getComputedStyle(el);
                var matrix = new WebKitCSSMatrix(style.transform);
                // Preserve translate but update scale
                el.style.transform = 'translate(' + matrix.m41 + 'px, ' + matrix.m42 + 'px) scale(' + newScale + ')';
            }
        }
    }

    // --- ADD TOOLS ---
    function addTextLayer() {
        var txt = document.getElementById('textInput').value;
        if(!txt) return;
        var div = document.createElement('div');
        div.innerText = txt;
        div.className = 'text-layer';
        div.style.color = document.getElementById('textColor').value;
        div.style.fontSize = document.getElementById('textSize').value + 'px';
        registerLayer(div, "Text", "text");
        closeAllMenus();
    }

    document.getElementById('overlayUpload').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(event) {
            var img = new Image();
            img.onload = function() {
                var c = document.createElement('canvas');
                c.className = 'canvas-layer';
                
                var maxW = cropper.getCanvasData().naturalWidth * 0.5;
                var scale = maxW / img.width;
                if(scale > 1) scale = 1;
                c.width = img.width * scale;
                c.height = img.height * scale;
                
                var ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, c.width, c.height);
                registerLayer(c, "Image", "canvas");
                closeAllMenus();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // --- DRAW ENGINE (FIXED) ---
    function populateDrawTargets() {
        var select = document.getElementById('drawTarget');
        select.innerHTML = '<option value="none">-- Select Layer to Draw On --</option><option value="new">Create New Full Draw Layer</option>';
        for(var i=0; i<layers.length; i++) {
            if(layers[i].type === 'canvas') {
                var opt = document.createElement('option');
                opt.value = layers[i].id;
                opt.innerText = "Draw/Erase on: " + layers[i].name;
                select.appendChild(opt);
            }
        }
    }

    function setupDrawTarget() {
        var targetVal = document.getElementById('drawTarget').value;
        if (targetVal === 'none') {
            activeDrawCanvas = null;
            return;
        }
        
        if (targetVal === 'new') {
            var canvasEl = document.createElement('canvas');
            canvasEl.className = 'canvas-layer';
            canvasEl.width = cropper.getCanvasData().naturalWidth;
            canvasEl.height = cropper.getCanvasData().naturalHeight;
            canvasEl.style.left = '50%'; 
            canvasEl.style.top = '50%';
            canvasEl.style.transform = 'translate(-50%, -50%) scale(1)';
            canvasEl.setAttribute('data-scale', '1');
            registerLayer(canvasEl, "Drawing", "canvas");
            
            document.getElementById('drawTarget').value = canvasEl.id;
            populateDrawTargets(); 
            document.getElementById('drawTarget').value = canvasEl.id;
            activeDrawCanvas = canvasEl;
        } else {
            activeDrawCanvas = document.getElementById(targetVal);
        }
    }

    var btnBrush = document.getElementById('modeDraw');
    var btnBlend = document.getElementById('modeBlend');
    var btnErase = document.getElementById('modeErase');
    function resetDrawBtns() { btnBrush.style.background='#333'; btnBlend.style.background='#333'; btnErase.style.background='#333'; }
    btnBrush.onclick = function() { drawMode = 'source-over'; resetDrawBtns(); this.style.background='var(--accent)'; showToast("Brush Active"); }
    btnBlend.onclick = function() { drawMode = 'screen'; resetDrawBtns(); this.style.background='var(--accent)'; showToast("Blend Active"); }
    btnErase.onclick = function() { drawMode = 'destination-out'; resetDrawBtns(); this.style.background='var(--accent)'; showToast("Eraser Active"); }

    function getEventPosForDraw(e, canvasEl) {
        var rect = canvasEl.getBoundingClientRect();
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        // Map screen pixels to internal canvas pixels perfectly
        var scaleX = canvasEl.width / rect.width;
        var scaleY = canvasEl.height / rect.height;
        
        return { 
            x: (clientX - rect.left) * scaleX, 
            y: (clientY - rect.top) * scaleY 
        };
    }

    function startDrawLogic(e) {
        if(!activeDrawCanvas || !document.getElementById('menu-draw').classList.contains('active-menu')) return;
        
        // Ensure touch is actually on the active canvas
        if(e.target !== activeDrawCanvas) return;

        currentDrawCtx = activeDrawCanvas.getContext('2d');
        isDrawing = true;
        
        var pos = getEventPosForDraw(e, activeDrawCanvas);
        currentDrawCtx.beginPath();
        currentDrawCtx.moveTo(pos.x, pos.y);
        e.preventDefault(); // Stop scrolling while drawing
    }

    function doDrawLogic(e) {
        if(!isDrawing || !currentDrawCtx || !activeDrawCanvas) return;
        
        var pos = getEventPosForDraw(e, activeDrawCanvas);
        
        currentDrawCtx.lineWidth = document.getElementById('drawSize').value;
        currentDrawCtx.lineCap = 'round';
        currentDrawCtx.lineJoin = 'round';
        currentDrawCtx.globalCompositeOperation = drawMode;
        currentDrawCtx.strokeStyle = drawMode === 'destination-out' ? "rgba(0,0,0,1)" : document.getElementById('drawColor').value;
        
        currentDrawCtx.lineTo(pos.x, pos.y);
        currentDrawCtx.stroke();
        e.preventDefault();
    }

    function stopDrawLogic() { isDrawing = false; currentDrawCtx = null; }

    // Bind draw events to the main window but validate target inside
    document.addEventListener('mousedown', startDrawLogic);
    document.addEventListener('mousemove', doDrawLogic);
    document.addEventListener('mouseup', stopDrawLogic);
    document.addEventListener('touchstart', startDrawLogic, {passive: false});
    document.addEventListener('touchmove', doDrawLogic, {passive: false});
    document.addEventListener('touchend', stopDrawLogic);

    // --- SAVING ---
    document.getElementById('downloadBtn').addEventListener('click', function () {
        if (!cropper) return;
        showToast("Flattening Image...");
        
        cropper.clear(); 
        var finalCanvas = cropper.getCroppedCanvas();
        var ctx = finalCanvas.getContext('2d');
        
        var containerRect = layerContainer.getBoundingClientRect();
        var cData = cropper.getCanvasData();
        var scale = cData.width / cData.naturalWidth;
        
        var sortedLayers = layers.slice().sort(function(a, b) {
            return parseInt(a.el.style.zIndex) - parseInt(b.el.style.zIndex);
        });

        for(var i=0; i<sortedLayers.length; i++) {
            var el = sortedLayers[i].el;
            var elRect = el.getBoundingClientRect();
            
            var nativeX = (elRect.left - containerRect.left) / scale;
            var nativeY = (elRect.top - containerRect.top) / scale;
            var nativeW = elRect.width / scale;
            var nativeH = elRect.height / scale;

            if(sortedLayers[i].type === 'canvas') {
                ctx.drawImage(el, nativeX, nativeY, nativeW, nativeH);
            } else if (sortedLayers[i].type === 'text') {
                var fontSize = parseInt(window.getComputedStyle(el).fontSize) / scale;
                ctx.font = "bold " + fontSize + "px sans-serif";
                ctx.fillStyle = el.style.color;
                ctx.textBaseline = "top";
                ctx.fillText(el.innerText, nativeX, nativeY);
            }
        }

        setTimeout(function() {
            var dataURL = finalCanvas.toDataURL('image/jpeg', 0.9);
            var link = document.createElement('a');
            link.href = dataURL;
            link.download = 'PixEdit_Masterpiece.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Saved!");
        }, 500);
    });

</script>
