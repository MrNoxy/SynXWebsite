<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixEdit Pro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #1c1c1e;
            --accent: #ff2a5f;
            --text: #ffffff;
            --text-muted: #8e8e93;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior-y: none;
            padding-bottom: 80px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: var(--bg-color);
            border-bottom: 1px solid #333;
        }

        .top-bar h1 { font-size: 18px; margin: 0; }
        .btn-text { color: var(--accent); background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px; }

        /* Upload Screen */
        .upload-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70vh; }
        .upload-screen label { background-color: var(--accent); color: #fff; padding: 15px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .upload-screen input[type="file"] { display: none; }

        /* Workspace */
        .workspace { display: none; width: 100%; height: calc(100vh - 140px); background-color: #000; position: relative; }
        img { display: block; max-width: 100%; }

        /* Menus */
        .menu-panel {
            display: none;
            padding: 15px;
            background-color: rgba(28, 28, 30, 0.95); /* Slightly transparent */
            backdrop-filter: blur(10px);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            position: fixed;
            bottom: 60px;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 10;
            max-height: 50vh;
            overflow-y: auto;
        }

        .active-menu { display: block; }
        
        /* Menu Header with Close Button */
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .menu-title { font-size: 14px; color: var(--text-muted); margin: 0; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; padding: 0 10px; cursor: pointer; }

        /* Controls */
        .tool-row { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .tool-btn { background: #333; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 12px; width: 30%; }
        
        .slider-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .slider-group label { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }

        .input-group { display: flex; flex-direction: column; margin-bottom: 10px;}
        .input-group label { font-size: 12px; margin-bottom: 4px; }
        .input-group input[type="text"], .input-group input[type="number"], .input-group input[type="color"] {
            padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: white; font-size: 16px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background-color: var(--bg-color);
            display: flex; overflow-x: auto;
            border-top: 1px solid #333; padding: 10px 0;
            white-space: nowrap; z-index: 20;
        }
        .nav-item { display: inline-flex; flex-direction: column; align-items: center; color: var(--text-muted); min-width: 70px; cursor: pointer; font-size: 11px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

    </style>
</head>
<body>

<div class="top-bar" id="topBar" style="display:none;">
    <button class="btn-text" style="color:var(--text-muted)" onclick="location.reload()">Cancel</button>
    <h1>PixEdit</h1>
    <button class="btn-text" id="downloadBtn">Save</button>
</div>

<div class="upload-screen" id="uploadScreen">
    <h1 style="margin-bottom: 30px; font-size: 32px; letter-spacing: 2px;">PixEdit</h1>
    <label for="upload">+ Select Photo</label>
    <input type="file" id="upload" accept="image/*">
</div>

<div class="workspace" id="workspace">
    <img id="image" src="">
</div>

<div class="menu-panel" id="menu-tools">
    <div class="menu-header">
        <p class="menu-title">Crop & Rotate</p>
        <button class="close-btn" onclick="closeAllMenus()">✕</button>
    </div>
    <div class="tool-row">
        <button class="tool-btn" id="rotateLeft">↺ Rotate Left</button>
        <button class="tool-btn" id="rotateRight">↻ Rotate Right</button>
        <button class="tool-btn" id="flipHorizontal">↔ Flip X</button>
    </div>
    
    <p class="menu-title" style="margin-top: 15px; border-bottom: 1px solid #333; padding-bottom:10px;">Resize Image</p>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <div class="input-group" style="flex: 1;">
            <label>Width</label><input type="number" id="resizeW">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>Height</label><input type="number" id="resizeH">
        </div>
    </div>
</div>

<div class="menu-panel" id="menu-effects">
    <div class="menu-header">
        <p class="menu-title">Adjustments</p>
        <button class="close-btn" onclick="closeAllMenus()">✕</button>
    </div>
    <div class="slider-group"><label><span>Brightness</span> <span id="val-brightness">100%</span></label><input type="range" id="brightness" min="0" max="200" value="100"></div>
    <div class="slider-group"><label><span>Contrast</span> <span id="val-contrast">100%</span></label><input type="range" id="contrast" min="0" max="200" value="100"></div>
    <div class="slider-group"><label><span>Saturation</span> <span id="val-saturation">100%</span></label><input type="range" id="saturation" min="0" max="200" value="100"></div>
    <div class="slider-group"><label><span>Hue</span> <span id="val-hue">0°</span></label><input type="range" id="hue" min="0" max="360" value="0"></div>
</div>

<div class="menu-panel" id="menu-text">
    <div class="menu-header">
        <p class="menu-title">Add Text</p>
        <button class="close-btn" onclick="closeAllMenus()">✕</button>
    </div>
    <div class="input-group">
        <label>Your Text</label>
        <input type="text" id="textInput" placeholder="Type something...">
    </div>
    <div class="input-group">
        <label>Color</label>
        <input type="color" id="textColor" value="#ffffff" style="height: 40px;">
    </div>
    <button class="tool-btn" style="width: 100%; background: var(--accent); font-weight: bold;">Stamp Text</button>
</div>

<div class="menu-panel" id="menu-draw">
    <div class="menu-header">
        <p class="menu-title">Draw</p>
        <button class="close-btn" onclick="closeAllMenus()">✕</button>
    </div>
    <div class="input-group">
        <label>Brush Color</label>
        <input type="color" id="drawColor" value="#ff2a5f" style="height: 40px;">
    </div>
    <div class="slider-group">
        <label><span>Brush Size</span></label>
        <input type="range" id="drawSize" min="1" max="50" value="5">
    </div>
    <button class="tool-btn" style="width: 100%; background: var(--accent); font-weight: bold;">Start Drawing</button>
</div>

<div class="bottom-nav" id="bottomNav" style="display:none;">
    <div class="nav-item" onclick="toggleMenu('tools', this)">
        <span class="nav-icon">✂️</span><span>Tools</span>
    </div>
    <div class="nav-item" onclick="toggleMenu('effects', this)">
        <span class="nav-icon">🎛️</span><span>Effects</span>
    </div>
    <div class="nav-item" onclick="toggleMenu('text', this)">
        <span class="nav-icon">Aa</span><span>Text</span>
    </div>
    <div class="nav-item" onclick="toggleMenu('draw', this)">
        <span class="nav-icon">🖌️</span><span>Draw</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    var uploadInput = document.getElementById('upload');
    var uploadScreen = document.getElementById('uploadScreen');
    var workspace = document.getElementById('workspace');
    var topBar = document.getElementById('topBar');
    var bottomNav = document.getElementById('bottomNav');
    var image = document.getElementById('image');
    
    var cropper;
    var currentAspectRatio = 1;
    var flipX = 1; 

    // --- Menu Toggle Logic (The "I Can't See!" Fix) ---
    function closeAllMenus() {
        var menus = document.querySelectorAll('.menu-panel');
        for (var i = 0; i < menus.length; i++) {
            menus[i].classList.remove('active-menu');
        }
        var navItems = document.querySelectorAll('.nav-item');
        for (var j = 0; j < navItems.length; j++) {
            navItems[j].classList.remove('active');
        }
    }

    function toggleMenu(menuName, element) {
        var targetMenu = document.getElementById('menu-' + menuName);
        var isActive = targetMenu.classList.contains('active-menu');
        
        closeAllMenus(); // Close everything first

        // If it wasn't active before, open it. (If it was active, it just stays closed!)
        if (!isActive) {
            targetMenu.classList.add('active-menu');
            element.classList.add('active');
        }
    }

    // --- Upload Logic ---
    uploadInput.addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function (event) {
            uploadScreen.style.display = 'none';
            topBar.style.display = 'flex';
            workspace.style.display = 'block';
            bottomNav.style.display = 'flex';
            image.src = event.target.result;

            if (cropper) cropper.destroy();

            cropper = new Cropper(image, {
                viewMode: 2, dragMode: 'move', autoCropArea: 0.9, responsive: true,
                ready: function () {
                    var data = cropper.getData(true);
                    document.getElementById('resizeW').value = data.width;
                    document.getElementById('resizeH').value = data.height;
                }
            });
        };
        reader.readAsDataURL(file);
    });

    // --- Tools & Filters ---
    document.getElementById('rotateLeft').addEventListener('click', function() { if (cropper) cropper.rotate(-90); });
    document.getElementById('rotateRight').addEventListener('click', function() { if (cropper) cropper.rotate(90); });
    document.getElementById('flipHorizontal').addEventListener('click', function() {
        if (cropper) { flipX = flipX === 1 ? -1 : 1; cropper.scaleX(flipX); }
    });

    var ranges = document.querySelectorAll('#menu-effects input[type="range"]');
    for (var j = 0; j < ranges.length; j++) {
        ranges[j].addEventListener('input', function() {
            var displayUnit = this.id === 'hue' ? '°' : '%';
            document.getElementById('val-' + this.id).innerText = this.value + displayUnit;

            var filterStr = 'brightness(' + document.getElementById('brightness').value + '%) ' +
                            'contrast(' + document.getElementById('contrast').value + '%) ' +
                            'saturate(' + document.getElementById('saturation').value + '%) ' +
                            'hue-rotate(' + document.getElementById('hue').value + 'deg)';
            
            var viewBoxes = document.querySelectorAll('.cropper-view-box img, .cropper-canvas img');
            for (var k = 0; k < viewBoxes.length; k++) {
                viewBoxes[k].style.filter = filterStr;
                viewBoxes[k].style.WebkitFilter = filterStr; 
            }
        });
    }
</script>

</body>
</html>
