<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Photo Editor</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent: #00e5ff;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
        }

        .container {
            max-width: 600px; /* Limits size on desktop */
            margin: 0 auto;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Upload Button */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-bottom: 15px;
        }

        .file-upload-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        /* Canvas Area */
        .image-container {
            width: 100%;
            max-height: 50vh; /* Keeps it visible on small screens */
            background-color: #000;
            margin-bottom: 15px;
            display: none; /* Hidden until image is uploaded */
            border-radius: 8px;
            overflow: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        /* Controls Panel */
        .controls {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            display: none; /* Hidden until image is uploaded */
        }

        h3 {
            font-size: 14px;
            margin: 15px 0 10px 0;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .resize-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 12px;
            margin-bottom: 4px;
        }

        .input-group input[type="number"] {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            font-size: 16px; /* 16px prevents iOS from zooming in on input focus */
        }

        /* Sliders */
        .slider-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        .slider-group label {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        #downloadBtn {
            margin-top: 20px;
            background-color: #00e676;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>PixEdit</h1>

    <div class="file-upload-wrapper">
        <button class="btn">📸 Choose a Picture</button>
        <input type="file" id="upload" accept="image/*">
    </div>

    <div class="image-container" id="imageContainer">
        <img id="image" src="">
    </div>

    <div class="controls" id="controls">
        <h3>1. Resize (Final Pixels)</h3>
        <p style="font-size: 11px; color:#888; margin-top:0;">Leave blank to keep the cropped size.</p>
        <div class="resize-grid">
            <div class="input-group">
                <label>Width (px)</label>
                <input type="number" id="resizeW" placeholder="Auto">
            </div>
            <div class="input-group">
                <label>Height (px)</label>
                <input type="number" id="resizeH" placeholder="Auto">
            </div>
        </div>

        <h3>2. Cool Adjustments</h3>
        <div class="slider-group">
            <label><span>Brightness</span> <span id="val-brightness">100%</span></label>
            <input type="range" id="brightness" min="0" max="200" value="100">
        </div>
        <div class="slider-group">
            <label><span>Contrast</span> <span id="val-contrast">100%</span></label>
            <input type="range" id="contrast" min="0" max="200" value="100">
        </div>
        <div class="slider-group">
            <label><span>Saturation</span> <span id="val-saturation">100%</span></label>
            <input type="range" id="saturation" min="0" max="200" value="100">
        </div>
        <div class="slider-group">
            <label><span>Trippy Hue</span> <span id="val-hue">0°</span></label>
            <input type="range" id="hue" min="0" max="360" value="0">
        </div>
        <div class="slider-group">
            <label><span>Vintage (Sepia)</span> <span id="val-sepia">0%</span></label>
            <input type="range" id="sepia" min="0" max="100" value="0">
        </div>

        <button class="btn" id="downloadBtn">💾 Save Edited Image</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    var uploadInput = document.getElementById('upload');
    var image = document.getElementById('image');
    var imageContainer = document.getElementById('imageContainer');
    var controls = document.getElementById('controls');
    var downloadBtn = document.getElementById('downloadBtn');

    var cropper;

    // Handle Image Upload
    uploadInput.addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function (event) {
            imageContainer.style.display = 'block';
            controls.style.display = 'block';
            image.src = event.target.result;

            if (cropper) {
                cropper.destroy();
            }

            cropper = new Cropper(image, {
                viewMode: 2,
                dragMode: 'move',
                autoCropArea: 0.8,
                responsive: true,
                restore: false,
                guides: true,
                center: true,
                highlight: false,
                cropBoxMovable: true,
                cropBoxResizable: true,
                toggleDragModeOnDblclick: false,
            });
            
            // Old-school loop (iPhone 5 Safari hates .forEach)
            var sliders = document.querySelectorAll('input[type="range"]');
            for (var i = 0; i < sliders.length; i++) {
                sliders[i].value = sliders[i].getAttribute('value');
                // Manually trigger the input event for old browsers
                var evt = document.createEvent('HTMLEvents');
                evt.initEvent('input', false, true);
                sliders[i].dispatchEvent(evt);
            }
            document.getElementById('resizeW').value = '';
            document.getElementById('resizeH').value = '';
        };
        reader.readAsDataURL(file);
    });

    // Handle Real-time Filters
    var ranges = document.querySelectorAll('input[type="range"]');
    for (var j = 0; j < ranges.length; j++) {
        ranges[j].addEventListener('input', function() {
            var unit = this.id === 'hue' ? 'deg' : '%';
            var displayUnit = this.id === 'hue' ? '°' : '%';
            document.getElementById('val-' + this.id).innerText = this.value + displayUnit;

            var br = document.getElementById('brightness').value;
            var co = document.getElementById('contrast').value;
            var sa = document.getElementById('saturation').value;
            var hu = document.getElementById('hue').value;
            var se = document.getElementById('sepia').value;

            var filterStr = 'brightness(' + br + '%) contrast(' + co + '%) saturate(' + sa + '%) hue-rotate(' + hu + 'deg) sepia(' + se + '%)';
            
            var viewBoxes = document.querySelectorAll('.cropper-view-box img, .cropper-canvas img');
            for (var k = 0; k < viewBoxes.length; k++) {
                viewBoxes[k].style.filter = filterStr;
                viewBoxes[k].style.WebkitFilter = filterStr; // Extra line required for old iOS Safari!
            }
        });
    }

    // Handle Processing and Download
    downloadBtn.addEventListener('click', function () {
        if (!cropper) return;

        var croppedCanvas = cropper.getCroppedCanvas();
        var finalWidth = parseInt(document.getElementById('resizeW').value, 10);
        var finalHeight = parseInt(document.getElementById('resizeH').value, 10);

        if (!finalWidth || isNaN(finalWidth) || !finalHeight || isNaN(finalHeight)) {
            finalWidth = croppedCanvas.width;
            finalHeight = croppedCanvas.height;
        }

        var finalCanvas = document.createElement('canvas');
        finalCanvas.width = finalWidth;
        finalCanvas.height = finalHeight;
        var ctx = finalCanvas.getContext('2d');

        var br = document.getElementById('brightness').value;
        var co = document.getElementById('contrast').value;
        var sa = document.getElementById('saturation').value;
        var hu = document.getElementById('hue').value;
        var se = document.getElementById('sepia').value;

        ctx.filter = 'brightness(' + br + '%) contrast(' + co + '%) saturate(' + sa + '%) hue-rotate(' + hu + 'deg) sepia(' + se + '%)';

        ctx.drawImage(croppedCanvas, 0, 0, finalWidth, finalHeight);

        // Older iOS doesn't support .toBlob(), so we use .toDataURL() instead
        var dataURL = finalCanvas.toDataURL('image/jpeg', 0.9);
        var link = document.createElement('a');
        link.href = dataURL;
        link.download = 'edited_photo.jpg';
        
        // Simulating a click to download
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
