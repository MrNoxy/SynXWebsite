<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixEdit Pro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root { --bg-color: #000; --panel-bg: #1c1c1e; --accent: #ff2a5f; --text: #fff; --text-muted: #8e8e93; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text); font-family: sans-serif; overscroll-behavior-y: none; padding-bottom: 80px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #333; }
        .top-bar h1 { font-size: 18px; margin: 0; }
        .btn-text { color: var(--accent); background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px; }

        .upload-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70vh; }
        .upload-screen label { background-color: var(--accent); color: #fff; padding: 15px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .upload-screen input[type="file"] { display: none; }

        .workspace { display: none; width: 100%; height: calc(100vh - 140px); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* The Canvas Overlays the Cropper */
        #mainCanvas { display: none; max-width: 100%; max-height: 100%; touch-action: none; position: absolute; z-index: 5; }
        .cropper-wrapper { width: 100%; height: 100%; position: absolute; z-index: 1; display: none; }
        img { display: block; max-width: 100%; }

        .menu-panel { display: none; padding: 15px; background-color: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); border-radius: 15px 15px 0 0; position: fixed; bottom: 60px; left: 0; width: 100%; box-sizing: border-box; z-index: 10; max-height: 50vh; overflow-y: auto; }
        .active-menu { display: block; }
        .menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .menu-title { font-size: 14px; color: var(--text-muted); margin: 0; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; padding: 0 10px; cursor: pointer; }

        .tool-row { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .tool-btn { background: #333; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 12px; width: 30%; cursor: pointer;}
        
        .slider-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .slider-group label { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }

        .input-group { display: flex; flex-direction: column; margin-bottom: 10px;}
        .input-group label { font-size: 12px; margin-bottom: 4px; }
        .input-group input { padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: white; font-size: 16px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--bg-color); display: flex; overflow-x: auto; border-top: 1px solid #333; padding: 10px 0; z-index: 20; }
        .nav-item { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); min-width: 65px; cursor: pointer; font-size: 10px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
        
        /* Toast notification */
        #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px; display: none; z-index: 100; font-weight: bold; }
    </style>
</head>
<body>

<div id="toast">Message here</div>

<div class="top-bar" id="topBar" style="display:none;">
    <button class="btn-text" style="color:var(--text-muted)" onclick="location.reload()">Reset</button>
    <h1>PixEdit</h1>
    <button class="btn-text" id="downloadBtn">Save</button>
</div>

<div class="upload-screen" id="uploadScreen">
    <h1 style="margin-bottom: 30px; font-size: 32px; letter-spacing: 2px;">PixEdit</h1>
    <label for="upload">+ Select Photo</label>
    <input type="file" id="upload" accept="image/*">
</div>

<div class="workspace" id="workspace">
    <div class="cropper-wrapper" id="cropperWrapper">
        <img id="image" src="">
    </div>
    <canvas id="mainCanvas"></canvas>
</div>

<div class="menu-panel" id="menu-tools">
    <div class="menu-header"><p class="menu-title">Crop & Rotate</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    <div class="tool-row">
        <button class="tool-btn" id="rotateLeft">↺ Left</button>
        <button class="tool-btn" id="rotateRight">↻ Right</button>
        <button class="tool-btn" id="flipHorizontal">↔ Flip X</button>
    </div>
</div>

<div class="menu-panel" id="menu-effects">
    <div class="menu-header"><p class="menu-title">Adjustments</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    <div class="slider-group"><label><span>Brightness</span><span id="val-brightness">100%</span></label><input type="range" id="brightness" min="0" max="200" value="100"></div>
    <div class="slider-group"><label><span>Contrast</span><span id="val-contrast">100%</span></label><input type="range" id="contrast" min="0" max="200" value="100"></div>
    <div class="slider-group"><label><span>Saturation</span><span id="val-saturation">100%</span></label><input type="range" id="saturation" min="0" max="200" value="100"></div>
    <div class="slider-group"><label><span>Hue</span><span id="val-hue">0°</span></label><input type="range" id="hue" min="0" max="360" value="0"></div>
</div>

<div class="menu-panel" id="menu-text">
    <div class="menu-header"><p class="menu-title">Stamp Text</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    <p style="font-size: 11px; color:#aaa; margin-top:0;">1. Type text below.<br>2. Tap anywhere on your photo to stamp it!</p>
    <div class="input-group"><input type="text" id="textInput" placeholder="Enter text..."></div>
    <div class="tool-row" style="justify-content: space-between;">
        <input type="color" id="textColor" value="#ffffff" style="height: 40px; width: 45%;">
        <input type="number" id="textSize" value="40" placeholder="Size (px)" style="width: 45%;">
    </div>
</div>

<div class="menu-panel" id="menu-draw">
    <div class="menu-header"><p class="menu-title">Draw / Paint</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    <div class="tool-row" style="justify-content: space-between;">
        <div class="input-group" style="width: 45%;"><label>Color</label><input type="color" id="drawColor" value="#ff2a5f" style="height: 40px; width: 100%;"></div>
        <div class="input-group" style="width: 45%;"><label>Brush Size</label><input type="number" id="drawSize" value="5" style="width: 100%;"></div>
    </div>
    <button class="tool-btn" id="eraserBtn" style="width: 100%; background: #444;">Toggle Eraser</button>
</div>

<div class="menu-panel" id="menu-addphoto">
    <div class="menu-header"><p class="menu-title">Add Photo</p><button class="close-btn" onclick="closeAllMenus()">✕</button></div>
    <p style="font-size: 11px; color:#aaa; margin-top:0;">1. Select an image.<br>2. Tap your photo to stamp the new image!</p>
    <label for="overlayUpload" style="background:var(--accent); padding:10px; display:block; text-align:center; border-radius:5px; margin-bottom:10px;">Select Overlay Image</label>
    <input type="file" id="overlayUpload" accept="image/*" style="display:none;">
    <div class="input-group"><label>Stamp Width (px)</label><input type="number" id="overlaySize" value="200"></div>
</div>

<div class="bottom-nav" id="bottomNav" style="display:none;">
    <div class="nav-item" onclick="toggleMenu('tools', this)"><span class="nav-icon">✂️</span><span>Crop</span></div>
    <div class="nav-item" onclick="toggleMenu('effects', this)"><span class="nav-icon">🎛️</span><span>Effects</span></div>
    <div class="nav-item" onclick="toggleMenu('text', this)"><span class="nav-icon">Aa</span><span>Text</span></div>
    <div class="nav-item" onclick="toggleMenu('draw', this)"><span class="nav-icon">🖌️</span><span>Draw</span></div>
    <div class="nav-item" onclick="toggleMenu('addphoto', this)"><span class="nav-icon">🖼️</span><span>Add Pic</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    var uploadInput = document.getElementById('upload');
    var uploadScreen = document.getElementById('uploadScreen');
    var workspace = document.getElementById('workspace');
    var topBar = document.getElementById('topBar');
    var bottomNav = document.getElementById('bottomNav');
    var image = document.getElementById('image');
    var cropperWrapper = document.getElementById('cropperWrapper');
    
    // Canvas vars
    var canvas = document.getElementById('mainCanvas');
    var ctx = canvas.getContext('2d');
    var currentMode = 'crop'; // 'crop', 'draw', 'text', 'addphoto'
    var isDrawing = false;
    var isEraser = false;
    var overlayImageObj = null;

    var cropper;
    var flipX = 1; 

    function showToast(msg) {
        var t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    function closeAllMenus() {
        var menus = document.querySelectorAll('.menu-panel');
        for (var i = 0; i < menus.length; i++) menus[i].classList.remove('active-menu');
        var navItems = document.querySelectorAll('.nav-item');
        for (var j = 0; j < navItems.length; j++) navItems[j].classList.remove('active');
    }

    function flattenCropperToCanvas() {
        if (cropper && currentMode === 'crop') {
            var cropped = cropper.getCroppedCanvas();
            canvas.width = cropped.width;
            canvas.height = cropped.height;
            
            // Apply filters during flatten
            var br = document.getElementById('brightness').value;
            var co = document.getElementById('contrast').value;
            var sa = document.getElementById('saturation').value;
            var hu = document.getElementById('hue').value;
            ctx.filter = 'brightness(' + br + '%) contrast(' + co + '%) saturate(' + sa + '%) hue-rotate(' + hu + 'deg)';
            
            ctx.drawImage(cropped, 0, 0);
            ctx.filter = 'none'; // reset
            
            cropperWrapper.style.display = 'none';
            canvas.style.display = 'block';
        }
    }

    function toggleMenu(menuName, element) {
        var targetMenu = document.getElementById('menu-' + menuName);
        var isActive = targetMenu.classList.contains('active-menu');
        closeAllMenus();

        if (!isActive) {
            targetMenu.classList.add('active-menu');
            element.classList.add('active');
            
            // Switch Modes
            if (menuName === 'tools' || menuName === 'effects') {
                currentMode = 'crop';
                canvas.style.display = 'none';
                cropperWrapper.style.display = 'block';
            } else {
                flattenCropperToCanvas();
                currentMode = menuName;
                if (menuName === 'text') showToast("Tap canvas to stamp text!");
                if (menuName === 'addphoto' && !overlayImageObj) showToast("Select an image first!");
            }
        }
    }

    // --- Upload Logic ---
    uploadInput.addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (event) {
            uploadScreen.style.display = 'none';
            topBar.style.display = 'flex';
            workspace.style.display = 'flex';
            cropperWrapper.style.display = 'block';
            bottomNav.style.display = 'flex';
            image.src = event.target.result;

            if (cropper) cropper.destroy();
            cropper = new Cropper(image, { viewMode: 2, dragMode: 'move', autoCropArea: 1, responsive: true });
        };
        reader.readAsDataURL(file);
    });

    // --- Overlay Photo Upload ---
    document.getElementById('overlayUpload').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(event) {
            overlayImageObj = new Image();
            overlayImageObj.src = event.target.result;
            showToast("Image loaded! Tap canvas to stamp.");
        };
        reader.readAsDataURL(file);
    });

    // --- Tools & Filters ---
    document.getElementById('rotateLeft').addEventListener('click', function() { if (cropper) cropper.rotate(-90); });
    document.getElementById('rotateRight').addEventListener('click', function() { if (cropper) cropper.rotate(90); });
    document.getElementById('flipHorizontal').addEventListener('click', function() {
        if (cropper) { flipX = flipX === 1 ? -1 : 1; cropper.scaleX(flipX); }
    });
    
    document.getElementById('eraserBtn').addEventListener('click', function() {
        isEraser = !isEraser;
        this.style.background = isEraser ? "var(--accent)" : "#444";
        this.innerText = isEraser ? "Eraser: ON" : "Toggle Eraser";
    });

    var ranges = document.querySelectorAll('#menu-effects input[type="range"]');
    for (var j = 0; j < ranges.length; j++) {
        ranges[j].addEventListener('input', function() {
            var displayUnit = this.id === 'hue' ? '°' : '%';
            document.getElementById('val-' + this.id).innerText = this.value + displayUnit;
            var filterStr = 'brightness(' + document.getElementById('brightness').value + '%) contrast(' + document.getElementById('contrast').value + '%) saturate(' + document.getElementById('saturation').value + '%) hue-rotate(' + document.getElementById('hue').value + 'deg)';
            var viewBoxes = document.querySelectorAll('.cropper-view-box img, .cropper-canvas img');
            for (var k = 0; k < viewBoxes.length; k++) { viewBoxes[k].style.filter = filterStr; viewBoxes[k].style.WebkitFilter = filterStr; }
        });
    }

    // --- Canvas Interaction (Touch/Mouse) ---
    function getCanvasPos(e) {
        var rect = canvas.getBoundingClientRect();
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches ? e.touches[0].clientY : e.clientY;
        // Scale coordinates based on visual size vs actual size
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function startInteract(e) {
        if (currentMode === 'crop') return;
        var pos = getCanvasPos(e);

        if (currentMode === 'draw') {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        } else if (currentMode === 'text') {
            var txt = document.getElementById('textInput').value;
            var col = document.getElementById('textColor').value;
            var siz = document.getElementById('textSize').value;
            if (txt) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.font = siz + "px sans-serif";
                ctx.fillStyle = col;
                ctx.fillText(txt, pos.x, pos.y);
            }
        } else if (currentMode === 'addphoto' && overlayImageObj) {
            var w = parseInt(document.getElementById('overlaySize').value);
            var ratio = overlayImageObj.height / overlayImageObj.width;
            var h = w * ratio;
            ctx.globalCompositeOperation = 'source-over';
            // Draw centered on touch
            ctx.drawImage(overlayImageObj, pos.x - (w/2), pos.y - (h/2), w, h);
        }
    }

    function moveInteract(e) {
        if (!isDrawing || currentMode !== 'draw') return;
        e.preventDefault(); // Stop scrolling while drawing
        var pos = getCanvasPos(e);
        
        ctx.lineWidth = document.getElementById('drawSize').value;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        if (isEraser) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = "rgba(0,0,0,1)";
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = document.getElementById('drawColor').value;
        }
        
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function endInteract() { isDrawing = false; }

    canvas.addEventListener('mousedown', startInteract);
    canvas.addEventListener('mousemove', moveInteract);
    canvas.addEventListener('mouseup', endInteract);
    canvas.addEventListener('touchstart', startInteract, {passive: false});
    canvas.addEventListener('touchmove', moveInteract, {passive: false});
    canvas.addEventListener('touchend', endInteract);

    // --- Save Logic ---
    document.getElementById('downloadBtn').addEventListener('click', function () {
        if (currentMode === 'crop') flattenCropperToCanvas(); // Ensure we have the final canvas
        var dataURL = canvas.toDataURL('image/jpeg', 0.9);
        var link = document.createElement('a');
        link.href = dataURL;
        link.download = 'PixEdit_Masterpiece.jpg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
