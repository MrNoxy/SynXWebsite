<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#161b22"/>
<meta name="description" content="Live status page for all our services"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg ' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300c17c'/></svg>"/>
<title>Status Page</title>

<style>
/* --------------  CSS VARIABLES  -------------- */
:root{
  --bg:#000000;--card:#161b22;--card2:#11141e;--tooltip:#11141e;
  --border:#30363d;--text:#c9d1d9;--subtle:#8b949e;--accent:#58a6ff;
  --ok:#00c17c;--down:#d2344e;--warning:#f0a500;--paused:#f0de4e;
  --maintenance:#6a42f5;--unknown:#777;--unlinked:#555a66;
  --radius:12px;--gap:24px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* ----  BUILT-IN THEMES  ---- */
[data-theme="light"]{
  --bg:#ffffff;--card:#f6f8fa;--card2:#f6f8fa;--tooltip:#f6f8fa;
  --border:#d0d7de;--text:#24292f;--subtle:#656d76;--accent:#0969da;
  --ok:#1a7f37;--down:#d1242f;--warning:#d4a72c;--paused:#bf8700;
  --maintenance:#8250df;--unknown:#656d76;--unlinked:#8c959f;
}
[data-theme="dark-purple"]{
  --bg:#0b0514;--card:#1f0e33;--card2:#180b26;--tooltip:#180b26;
  --border:#3c1e5c;--text:#e2d5f3;--subtle:#a18daf;--accent:#a78bfa;
  --ok:#34d399;--down:#f87272;--warning:#fbbf24;--paused:#fde047;
  --maintenance:#c084fc;--unknown:#6b7280;--unlinked:#4b5563;
}
[data-theme="green"]{
  --bg:#021a03;--card:#063a06;--card2:#042b04;--tooltip:#042b04;
  --border:#166416;--text:#dcfce7;--subtle:#a7f3d0;--accent:#4ade80;
  --ok:#22c55e;--down:#ef4444;--warning:#f59e0b;--paused:#fcd34d;
  --maintenance:#818cf8;--unknown:#6b7280;--unlinked:#4b5563;
}
[data-theme="blue"]{
  --bg:#00172a;--card:#003355;--card2:#002944;--tooltip:#002944;
  --border:#005c99;--text:#e0f2fe;--subtle:#7dd3fc;--accent:#38bdf8;
  --ok:#22d3ee;--down:#f43f5e;--warning:#facc15;--paused:#fde047;
  --maintenance:#818cf8;--unknown:#64748b;--unlinked:#475569;
}
[data-theme="dark-rosa"]{
  --bg:#1c0615;--card:#3b0f2b;--card2:#2e0b22;--tooltip:#2e0b22;
  --border:#6b1d4f;--text:#fce7f3;--subtle:#f9a8d4;--accent:#f472b6;
  --ok:#34d399;--down:#fb7185;--warning:#fbbf24;--paused:#fde047;
  --maintenance:#c084fc;--unknown:#6b7280;--unlinked:#4b5563;
}
[data-theme="light-rosa"]{
  --bg:#fff1f2;--card:#ffe4e6;--card2:#fed7da;--tooltip:#fed7da;
  --border:#fda4af;--text:#881337;--subtle:#f43f5e;--accent:#ec4899;
  --ok:#10b981;--down:#e11d48;--warning:#f59e0b;--paused:#fcd34d;
  --maintenance:#8b5cf6;--unknown:#9ca3af;--unlinked:#6b7280;
}
[data-theme="halloween"]{
  --bg:#1c110a;--card:#3a200f;--card2:#2c180a;--tooltip:#2c180a;
  --border:#7c3f0f;--text:#fbbf24;--subtle:#fdba74;--accent:#f97316;
  --ok:#84cc16;--down:#dc2626;--warning:#f59e0b;--paused:#fde047;
  --maintenance:#a855f7;--unknown:#6b7280;--unlinked:#4b5563;
}
[data-theme="christmas"]{
  --bg:#0f1a0f;--card:#1a3a1a;--card2:#122912;--tooltip:#122912;
  --border:#166534;--text:#dcfce7;--subtle:#86efac;--accent:#22c55e;
  --ok:#22c55e;--down:#ef4444;--warning:#fbbf24;--paused:#fde047;
  --maintenance:#818cf8;--unknown:#6b7280;--unlinked:#4b5563;
}
[data-theme="hack"]{
  --bg:#000;--card:#0d0d0d;--card2:#0a0a0a;--tooltip:#0a0a0a;
  --border:#00ff00;--text:#00ff00;--subtle:#39ff14;--accent:#00ff41;
  --ok:#00ff00;--down:#ff073a;--warning:#ffaa00;--paused:#fff500;
  --maintenance:#0ff;--unknown:#7c7c7c;--unlinked:#555;
}
[data-theme="neon"]{
  --bg:#0d0221;--card:#1d1033;--card2:#160b26;--tooltip:#160b26;
  --border:#6e44ff;--text:#f0f;--subtle:#ff44cc;--accent:#00f7ff;
  --ok:#00ff89;--down:#ff2a6d;--warning:#ffe74c;--paused:#f5ff90;
  --maintenance:#05d9e8;--unknown:#8c8c8c;--unlinked:#555;
}

/* --------------  RESET + BASE  -------------- */
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 0;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* --------------  ANIMATIONS  -------------- */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* --------------  GENERAL STATUS BAR  -------------- */
#generalStatusBar{width:780px;max-width:95%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 24px;margin-bottom:var(--gap);display:flex;flex-direction:column;gap:6px;animation:fadeIn .4s ease}
#generalStatusText{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
#generalStatusIcon{width:14px;height:14px;border-radius:50%;background:var(--ok);flex-shrink:0}
#generalStatusIcon.down{background:var(--down)}
#generalStatusIcon.degraded{background:var(--warning)}
#generalStatusIcon.paused{background:var(--paused)}
#generalStatusIcon.maintenance{background:var(--maintenance)}
#generalStatusIcon.unknown{background:var(--unknown)}
#generalStatusIcon.unlinked{background:var(--unlinked)}
#generalLastUpdated{font-size:12px;color:var(--subtle)}
#generalAnnouncement{color:var(--warning);white-space:pre-wrap;margin-top:4px;display:none}

/* --------------  STATUS CONTAINER  -------------- */
.status-container{width:780px;max-width:95%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:var(--gap);animation:fadeIn .5s ease}
.app-section{display:flex;flex-direction:column;gap:12px;animation:popIn .4s ease both}
.top-bar{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px}
.status-icon{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.status-icon.down{background:var(--down)}
.status-icon.degraded{background:var(--warning)}
.status-icon.paused{background:var(--paused)}
.status-icon.maintenance{background:var(--maintenance)}
.status-icon.unknown{background:var(--unknown)}
.status-icon.unlinked{background:var(--unlinked)}

/* --------------  MINI BAR CHART  -------------- */
.status-bar-container{display:flex;flex-direction:column;gap:4px}
.status-bar{display:flex;gap:3px}
.day-labels{display:flex;gap:3px;font-size:12px;color:var(--subtle)}
.day-label{width:48px;text-align:center}
.label-start,.label-end{font-weight:600;color:var(--text)}
.bar-box{width:48px;height:14px;border-radius:4px;background:var(--ok);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.bar-box.down{background:var(--down)}
.bar-box.degraded{background:var(--warning)}
.bar-box.paused{background:var(--paused)}
.bar-box.maintenance{background:var(--maintenance)}
.bar-box.unknown{background:var(--unknown)}
.bar-box.unlinked{background:var(--unlinked)}
.bar-box:hover{transform:scale(1.05)}
.bar-box.operational:hover{box-shadow:0 0 6px 2px rgba(0,193,124,.3)}
.bar-box.down:hover{box-shadow:0 0 6px 2px rgba(210,52,78,.3)}
.bar-box.degraded:hover{box-shadow:0 0 6px 2px rgba(240,165,0,.3)}
.bar-box.paused:hover{box-shadow:0 0 6px 2px rgba(240,222,78,.3)}
.bar-box.maintenance:hover{box-shadow:0 0 6px 2px rgba(106,66,245,.3)}
.bar-box.unknown:hover{box-shadow:0 0 6px 2px rgba(119,119,119,.3)}
.bar-box.unlinked:hover{box-shadow:0 0 6px 2px rgba(85,90,102,.3)}

/* --------------  TOOLTIP  -------------- */
#statusTooltip{position:fixed;background:var(--tooltip);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1000;max-width:280px;line-height:1.4}

/* --------------  RECENT ACTIVITY  ––  infinite scroll  -------------- */
.timeline-container{width:780px;max-width:95%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-top:var(--gap);animation:fadeIn .5s ease}
.timeline-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--gap)}
.timeline-title{font-size:18px;font-weight:700;color:var(--warning)}
.period-selector{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;transition:border-color .2s}
.period-selector:hover{border-color:var(--accent)}
.period-selector:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.1)}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:var(--gap);animation:fadeIn .3s ease both}
.timeline-item::before{content:"";position:absolute;left:-24px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--border);border:3px solid var(--bg);transform:translateX(-50%);transition:background .2s}
.timeline-item.success::before{background:var(--ok)}
.timeline-item.warning::before{background:var(--warning)}
.timeline-item.danger::before{background:var(--down)}
.timeline-item.info::before{background:var(--accent)}
.timeline-content{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:16px;transition:border-color .2s,box-shadow .2s}
.timeline-content:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.timeline-time{font-size:12px;color:var(--subtle);margin-bottom:6px;font-weight:500}
.timeline-title{font-weight:600;margin-bottom:6px;font-size:15px}
.timeline-description{color:var(--subtle);font-size:14px;line-height:1.5;white-space:pre-wrap}
.timeline-meta{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--subtle)}
.timeline-badge{background:#21262d;border:1px solid var(--border);border-radius:12px;padding:4px 8px;font-size:11px;font-weight:600}
.timeline-badge.success{background:rgba(0,193,124,.1);border-color:var(--ok);color:var(--ok)}
.timeline-badge.warning{background:rgba(240,165,0,.1);border-color:var(--warning);color:var(--warning)}
.timeline-badge.danger{background:rgba(210,52,78,.1);border-color:var(--down);color:var(--down)}
.timeline-badge.info{background:rgba(88,166,255,.1);border-color:var(--accent);color:var(--accent)}
.copy-btn{margin-left:auto;background:0 0;border:none;color:var(--accent);cursor:pointer;font-size:12px}
.copy-btn:hover{text-decoration:underline}

/* --------------  SKELETON  -------------- */
.skeleton{background:linear-gradient(90deg,var(--border) 25%,rgba(88,166,255,.1) 50%,var(--border) 75%);background-size:200% 100%;animation:skeleton 1.2s infinite;border-radius:var(--radius)}
.bar-box.skeleton,.status-icon.skeleton{background:var(--border)}
.timeline-item.skeleton .timeline-content{height:80px}

/* --------------  THEME SWITCHER – vertical / right / middle  -------------- */
.theme-switcher{
  position:fixed;
  right:12px; top:50%; transform:translateY(-50%);
  display:flex; flex-direction: column; gap:6px;
  z-index:2000;
}
.theme-btn{
  background:var(--card); border:1px solid var(--border); color:var(--text);
  padding:6px 10px; border-radius:8px; cursor:pointer; font-size:13px;
  transition:border-color .2s;
}
.theme-btn:hover{border-color:var(--accent)}
.offline-banner{display:none;position:sticky;top:0;width:100%;background:var(--down);color:#fff;text-align:center;padding:8px;font-size:13px;z-index:1500}

/* --------------  RESPONSIVE  -------------- */
@media (max-width:800px){
  body{padding:24px 0}
  #generalStatusBar,.status-container,.timeline-container{width:95%}
}
</style>
</head>
<body>

<div class="offline-banner" id="offlineBanner">You’re offline – data may be stale</div>

<!--  vertical theme switcher  -->
<div class="theme-switcher" aria-label="Theme switcher">
  <button class="theme-btn" data-theme="dark" title="Dark">🌙</button>
  <button class="theme-btn" data-theme="light" title="Light">☀️</button>
  <button class="theme-btn" data-theme="dark-purple" title="Dark Purple">🟣</button>
  <button class="theme-btn" data-theme="green" title="Green">🟢</button>
  <button class="theme-btn" data-theme="blue" title="Blue">🔵</button>
  <button class="theme-btn" data-theme="dark-rosa" title="Dark Rosa">🌸</button>
  <button class="theme-btn" data-theme="light-rosa" title="Light Rosa">💗</button>
  <button class="theme-btn" data-theme="halloween" title="Halloween">🎃</button>
  <button class="theme-btn" data-theme="christmas" title="Christmas">🎄</button>
  <button class="theme-btn" data-theme="hack" title="Hack">👾</button>
  <button class="theme-btn" data-theme="neon" title="Neon">🌆</button>
</div>

<!--  general status  -->
<div id="generalStatusBar" role="region" aria-label="General status">
  <div id="generalStatusText">
    <div id="generalStatusIcon" aria-hidden="true"></div>
    <span id="generalStatusLabel">Loading status…</span>
  </div>
  <div id="generalLastUpdated" aria-live="polite">Loading update time…</div>
  <div id="generalAnnouncement" role="note"></div>
</div>

<!--  apps grid  -->
<div class="status-container" id="statusContainer" role="region" aria-label="Services status">
  <div class="app-section">
    <div class="top-bar"><span class="status-icon skeleton"></span><span class="skeleton" style="width:120px;height:16px"></span></div>
    <div class="status-bar-container">
      <div class="status-bar">
        <div class="bar-box skeleton"></div><div class="bar-box skeleton"></div><div class="bar-box skeleton"></div>
        <div class="bar-box skeleton"></div><div class="bar-box skeleton"></div>
      </div>
    </div>
  </div>
</div>

<!--  recent activity  ––  infinite scroll  -->
<div class="timeline-container" role="region" aria-label="Recent activity">
  <div class="timeline-header">
    <h2 class="timeline-title">Recent Activity</h2>
    <select class="period-selector" id="activityPeriod" aria-label="Select time period">
      <option value="24h">Last 24 hours</option>
      <option value="7d" selected>Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="90d">Last 90 days</option>
      <option value="120d">Last 120 days</option>
    </select>
  </div>
  <div class="timeline" id="activityTimeline" aria-live="polite">
    <div class="timeline-item skeleton"><div class="timeline-content"></div></div>
  </div>
  <div id="loadMore" style="text-align:center;padding:12px;color:var(--subtle);cursor:pointer;display:none;">Load more</div>
</div>

<div id="statusTooltip" role="tooltip"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js "></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js "></script>
<script src="firebaseConfig.js"></script>

<script>
/* ----------  tiny helpers  ---------- */
const $ = q => document.querySelector(q);
const copyText = str => navigator.clipboard?.writeText(str).catch(()=>{});
const timeAgo = ts=>{
  const sec=Math.floor((Date.now()-ts)/1000);
  if(sec<60)return`${sec}s ago`;
  const min=Math.floor(sec/60);
  if(min<60)return`${min}m ago`;
  const h=Math.floor(min/60);
  if(h<24)return`${h}h ago`;
  const d=Math.floor(h/24);
  return`${d} day${d>1?'s':''} ago`;
};
const deepEqual = (a,b)=> JSON.stringify(a) === JSON.stringify(b);

/* ----------  firebase  ---------- */
firebase.initializeApp(window.firebaseConfig);
const db = firebase.database();

/* ----------  theme switcher  ---------- */
document.addEventListener('click', e=>{
  if(!e.target.matches('.theme-btn')) return;
  const th = e.target.dataset.theme;
  document.documentElement.setAttribute('data-theme', th);
  localStorage.setItem('theme', th);
});
(()=>{
  const th = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', th);
})();

/* ----------  offline banner  ---------- */
window.addEventListener('online', ()=> $('#offlineBanner').style.display='none');
window.addEventListener('offline', ()=> $('#offlineBanner').style.display='block');

/* ----------  config  ---------- */
const MAX_DAYS = 14;
const STATUS_NAMES = { operational:'Operational', down:'Down', degraded:'Degraded', paused:'Paused', maintenance:'Maintenance', unknown:'Unknown', unlinked:'Unlinked' };

/* ----------  tooltip  ---------- */
const tip = $('#statusTooltip');
function showTooltip(e, html){
  tip.innerHTML = html; tip.style.opacity = '1'; positionTooltip(e);
}
function hideTooltip(){ tip.style.opacity = '0'; }
function positionTooltip(e){
  const pad=12; let x=e.clientX+pad, y=e.clientY+pad;
  const r=tip.getBoundingClientRect();
  if(x+r.width+pad>window.innerWidth) x=e.clientX-r.width-pad;
  if(y+r.height+pad>window.innerHeight) y=e.clientY-r.height-pad;
  tip.style.left = x+'px'; tip.style.top  = y+'px';
}

/* ----------  bar builder  ---------- */
function renderBars(app){
  const today = new Date().toISOString().split('T')[0];
  let boxes=[], labels=[];
  for(let i=MAX_DAYS-1;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    let status='unlinked';
    if(app.history?.[ds]){ const v=app.history[ds]; status=typeof v==='string'?v:(v.status||'unknown'); }
    const cls=status==='operational'?'operational':status;
    boxes.push(`<div class="bar-box ${cls}" data-status="${status}" data-date="${ds}" aria-label="${d.toLocaleDateString()} ${STATUS_NAMES[status]}"></div>`);
    if(i===MAX_DAYS-1) labels.push(`<div class="day-label label-start">${MAX_DAYS} days ago</div>`);
    else if(i===0)     labels.push(`<div class="day-label label-end">Today</div>`);
    else               labels.push('<div class="day-label"></div>');
  }
  return `<div class="status-bar-container"><div class="status-bar">${boxes.join('')}</div><div class="day-labels">${labels.join('')}</div></div>`;
}

/* ----------  app section  ---------- */
function renderAppSection(app){
  const today = new Date().toISOString().split('T')[0];
  let todayStatus='unlinked';
  if(app.history?.[today]){ const v=app.history[today]; todayStatus=typeof v==='string'?v:(v.status||'unknown'); }
  const cls=todayStatus==='operational'?'operational':todayStatus;
  return `<div class="app-section"><div class="top-bar"><span class="status-icon ${cls}" aria-hidden="true"></span><span>${app.name||'Unnamed App'}</span></div>${renderBars(app)}</div>`;
}

/* ----------  general status  (old colours + wording)  ---------- */
function updateGeneralStatus(apps){
  const icon=$('#generalStatusIcon'), label=$('#generalStatusLabel'), last=$('#generalLastUpdated');
  if(!apps||apps.length===0){ label.textContent='No apps available'; icon.style.backgroundColor='#777'; last.textContent=''; return; }
  const todayStr=new Date().toISOString().split('T')[0];
  const statusSet=new Set(); let newestUpdate=0;
  apps.forEach(app=>{
    if(app.lastUpdated&&app.lastUpdated>newestUpdate) newestUpdate=app.lastUpdated;
    const todayData=app.history?.[todayStr];
    let todayStatus='unlinked';
    if(todayData){ if(typeof todayData==='string') todayStatus=todayData; else if(typeof todayData==='object'&&todayData.status) todayStatus=todayData.status; }
    if(!['unknown','unlinked',undefined].includes(todayStatus)) statusSet.add(todayStatus);
  });
  const statuses=[...statusSet];
  if(statuses.includes('down')) icon.style.backgroundColor='#d2344e';
  else if(statuses.includes('degraded')) icon.style.backgroundColor='#f0a500';
  else if(statuses.includes('paused')) icon.style.backgroundColor='#f0de4e';
  else if(statuses.includes('maintenance')) icon.style.backgroundColor='#6a42f5';
  else icon.style.backgroundColor='#00c17c';
  if(statuses.length===0||(statuses.length===1&&statuses[0]==='operational')) label.textContent='All services are online';
  else{
    const readable={down:'down',degraded:'degraded',paused:'paused',maintenance:'under maintenance'};
    const statusWords=statuses.filter(s=>s!=='operational').map(s=>readable[s]||(s.charAt(0).toUpperCase()+s.slice(1)));
    label.textContent=`Some services are ${statusWords.join(' or ')}`;
  }
  last.textContent=newestUpdate?`Last updated ${timeAgo(newestUpdate)}`:'';
}

/* ----------  announcement  ---------- */
function updateAnnouncement(text){
  const el=$('#generalAnnouncement');
  if(text?.trim()){ el.style.display='block'; el.textContent=text; } else el.style.display='none';
}

/* --------------------------------------------------
  RECENT ACTIVITY  ––  INFINITE SCROLL  ––  120 d max
  1. build master list once per period
  2. render next slice on demand
---------------------------------------------------*/
let timelineAll = [];        // master sorted list
let timelineRendered = 0;    // how many already in DOM
let periodHours = 168;       // 7 d default
let lastTimelineApps = '';   // JSON cache to avoid re-build
let noMoreEvents = false;    // true when we reach 120 d or Firebase empty

const PER_PAGE = 25;

function periodToHours(p){ 
  return {
    '24h': 24, 
    '7d': 168, 
    '30d': 720, 
    '90d': 2160, 
    '120d': 2880
  }[p] || 168; 
}

function buildMasterTimeline(apps, period) {
  const hrs = periodToHours(period);
  const now = Date.now();
  const ev = [];
  
  apps.forEach(a => {
    if (!a.history) return;
    Object.entries(a.history).forEach(([ds, val]) => {
      
      // --- START FIX: Smart Time Detection ---
      // 1. Default to midnight (UTC) of that day
      let t = new Date(ds).getTime();

      // 2. If the history item has a specific timestamp inside it, use that
      if (typeof val === 'object' && val.timestamp) {
        t = val.timestamp;
      } 
      // 3. Fallback: If this history date matches the App's "Last Updated" date, use the precise global timestamp
      else if (a.lastUpdated) {
        const lastUpDate = new Date(a.lastUpdated).toISOString().split('T')[0];
        if (ds === lastUpDate) {
          t = a.lastUpdated;
        }
      }
      // --- END FIX ---

      if ((now - t) / 36e5 > hrs) return;

      const st = (typeof val === 'string' ? val : (val.status || 'unknown'));
      const note = typeof val === 'object' ? val.notes || '' : '';
      const ver = typeof val === 'object' ? val.version || 'N/A' : 'N/A';
      const type = st === 'down' ? 'danger' : st === 'degraded' ? 'warning' : st === 'maintenance' ? 'info' : 'success';
      
      ev.push({
        type,
        time: t, // Use the smart time variable 't'
        title: `${a.name} – ${STATUS_NAMES[st]}`,
        description: note || `Service status changed to ${st}`,
        app: a.name,
        version: ver
      });
    });
  });
  
  ev.sort((a, b) => b.time - a.time);
  timelineAll = ev;
  timelineRendered = 0;
  noMoreEvents = false;
}

function renderNextTimelineSlice(){
  if(noMoreEvents) return;
  const slice=timelineAll.slice(timelineRendered,timelineRendered+PER_PAGE);
  if(slice.length===0){ noMoreEvents=true; $('#loadMore').style.display='none'; return; }

  const tl=$('#activityTimeline');
  const html=slice.map((e,i)=>`
    <div class="timeline-item ${e.type}" style="animation-delay:${(timelineRendered+i)*.05}s">
      <div class="timeline-content">
        <div class="timeline-time">${timeAgo(e.time)}</div>
        <div class="timeline-title">${e.title}</div>
        <div class="timeline-description">${e.description}</div>
        <div class="timeline-meta">
          <span class="timeline-badge ${e.type}">${e.app}</span>
          ${e.version!=='N/A'?`<span class="timeline-badge info">v${e.version}</span>`:''}
          <button class="copy-btn" aria-label="Copy details" data-copy="${e.title} – ${e.description}">Copy</button>
        </div>
      </div>
    </div>`).join('');
  tl.insertAdjacentHTML('beforeend',html);
  tl.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{ copyText(btn.dataset.copy); btn.textContent='Copied'; setTimeout(()=>btn.textContent='Copy',1500); });
  });
  timelineRendered+=slice.length;
  $('#loadMore').style.display=(timelineRendered>=timelineAll.length)?'none':'block';
  if(timelineRendered>=timelineAll.length) noMoreEvents=true;
}
/* ----------  autofill missing days (Keep-Alive)  ---------- */
function autofillTodayStatuses(apps) {
  const todayStr = new Date().toISOString().split("T")[0];
  let modified = false;

  apps.forEach(app => {
    if (!app.history) app.history = {};
    // If today already exists, skip
    if (app.history[todayStr]) return;

    // Find the most recent past entry
    const historyDates = Object.keys(app.history).filter(d => d < todayStr).sort().reverse();
    if (historyDates.length > 0) {
      const recentDate = historyDates[0];
      // Copy the old status to today
      app.history[todayStr] = JSON.parse(JSON.stringify(app.history[recentDate]));
      
      if(typeof app.history[todayStr] === 'object') {
          // Clear notes so old notes don't repeat daily
          app.history[todayStr].notes = ""; 
          // *** CRITICAL FIX: Delete the stale timestamp so it doesn't appear 30 days old ***
          delete app.history[todayStr].timestamp; 
      }
      modified = true;
    }
  });

  // Save back to Firebase if we made changes
  if (modified) {
    db.ref('statusApps').set(apps).catch(console.error);
  }
  return apps;
}

/* ----------  main data fetch  ---------- */
let lastAppsJson='';
function loadAll(){
  Promise.all([db.ref('statusApps').get(),db.ref('statusAnnouncement').get()])
    .then(([appsSnap,annSnap])=>{
      let apps = appsSnap.val() || []; // Change 'const' to 'let'
      const ann = annSnap.val() || '';

      // --- ADD THIS LINE ---
      apps = autofillTodayStatuses(apps); 
      // --------------------

      /* ------  apps panel  ------ */
      if(!deepEqual(apps,JSON.parse(lastAppsJson||'[]'))){
        lastAppsJson=JSON.stringify(apps);
        const container=$('#statusContainer');
        container.innerHTML=apps.length?apps.map(renderAppSection).join(''):'<div style="text-align:center;padding:40px;color:var(--subtle)">No apps yet.</div>';
        updateGeneralStatus(apps);
        updateAnnouncement(ann);
        container.querySelectorAll('.bar-box').forEach(b=>{
          b.addEventListener('mouseenter',e=>{
            const st=e.target.dataset.status,ds=e.target.dataset.date;
            const d=new Date(ds);
            showTooltip(e,`<strong>${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</strong><br>${STATUS_NAMES[st]}`);
          });
          b.addEventListener('mousemove',positionTooltip);
          b.addEventListener('mouseleave',hideTooltip);
        });
      }
      /* ------  timeline  ------ */
      const per=$('#activityPeriod').value;
      if(per!==$('#activityPeriod').dataset.cur){
        $('#activityPeriod').dataset.cur=per;
        buildMasterTimeline(apps,per);
        $('#activityTimeline').innerHTML='';
        renderNextTimelineSlice();
      }else if(!deepEqual(apps,JSON.parse(lastTimelineApps||'[]'))){
        lastTimelineApps=JSON.stringify(apps);
        buildMasterTimeline(apps,per);
        $('#activityTimeline').innerHTML='';
        renderNextTimelineSlice();
      }else{
        // same data – just ensure button is visible if more items exist
        $('#loadMore').style.display=(timelineRendered>=timelineAll.length)?'none':'block';
      }
    })
    .catch(console.error);
}

/* ----------  boot + periodic refresh  ---------- */
loadAll();
setInterval(()=>requestAnimationFrame(loadAll),1000);

/* ----------  period selector  ---------- */
$('#activityPeriod').addEventListener('change',()=>{
  periodHours=$('#activityPeriod').value;
  $('#activityPeriod').dataset.cur=periodHours;
  const apps=JSON.parse(lastAppsJson||'[]');
  buildMasterTimeline(apps,periodHours);
  $('#activityTimeline').innerHTML='';
  renderNextTimelineSlice();
});

/* ----------  infinite scroll  ---------- */
$('#loadMore').addEventListener('click',renderNextTimelineSlice);
</script>
