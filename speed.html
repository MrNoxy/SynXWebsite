<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #111; color: white; 
        }
        
        /* Floating Speedometer */
        #speed-container { 
            position: absolute; top: 8%; left: 50%; transform: translateX(-50%); z-index: 1000; 
            background: rgba(20, 20, 20, 0.85); padding: 20px 40px; border-radius: 24px; 
            text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); 
        }
        #speed { font-size: 5rem; font-weight: 800; margin: 0; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        #unit { font-size: 1.2rem; color: #888; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-top: 5px; }
        
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Bottom Stats Bar */
        .stats { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 1000; 
            display: flex; gap: 30px; background: rgba(20, 20, 20, 0.85); padding: 15px 30px; 
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            width: max-content;
        }
        .stat-box { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #00ff88; }
        .stat-label { font-size: 0.75rem; color: #aaa; margin-top: 4px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="speed-container">
        <div id="speed">0</div>
        <div id="unit">km/h</div>
    </div>

    <div class="stats">
        <div class="stat-box">
            <div id="max-speed" class="stat-value">0</div>
            <div class="stat-label">MAX (km/h)</div>
        </div>
        <div class="stat-box">
            <div id="accuracy" class="stat-value">--</div>
            <div class="stat-label">GPS ERROR (m)</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize map without zoom controls for a cleaner mobile UI
        const map = L.map('map', { zoomControl: false }).setView([0, 0], 15);
        
        // Dark mode map tiles (easier on the eyes while driving)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        // Visuals for the map
        const marker = L.circleMarker([0, 0], { radius: 8, color: '#00ff88', fillColor: '#00ff88', fillOpacity: 1 }).addTo(map);
        const pathLine = L.polyline([], { color: '#00ff88', weight: 5, opacity: 0.8 }).addTo(map);

        // DOM Elements
        const speedEl = document.getElementById('speed');
        const maxSpeedEl = document.getElementById('max-speed');
        const accuracyEl = document.getElementById('accuracy');
        
        let maxSpeed = 0;
        let firstLoad = true;

        if ("geolocation" in navigator) {
            // watchPosition triggers every time the hardware reports a new coordinate
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                // Hardware reports speed in meters per second. Convert to km/h.
                // If stationary, some devices report null.
                const speedMs = position.coords.speed || 0; 
                let speedKmh = Math.round(speedMs * 3.6);
                
                if (position.coords.speed === null) speedKmh = 0;

                // Update Max Speed
                if (speedKmh > maxSpeed) {
                    maxSpeed = speedKmh;
                    maxSpeedEl.innerText = maxSpeed;
                }

                // Update UI
                speedEl.innerText = speedKmh;
                accuracyEl.innerText = Math.round(position.coords.accuracy);

                // Update Map
                const newLatLng = new L.LatLng(lat, lng);
                marker.setLatLng(newLatLng);
                pathLine.addLatLng(newLatLng);

                // Auto-center map on first load, pan smoothly afterwards
                if (firstLoad) {
                    map.setView(newLatLng, 17);
                    firstLoad = false;
                } else {
                    map.panTo(newLatLng);
                }

            }, (error) => {
                console.error("GPS Error: ", error.message);
                if (error.code === 1) alert("Location access denied. Please allow GPS access in your iPhone settings.");
            }, {
                // These settings force the phone to use the most accurate hardware available
                enableHighAccuracy: true,
                maximumAge: 0, 
                timeout: 5000
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    </script>
</body>
</html>
