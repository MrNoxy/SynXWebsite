<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive Tracker Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #111; color: white; overflow: hidden;
        }
        
        .nav-tabs {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 2000;
            display: flex; background: rgba(10, 10, 10, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .tab-btn {
            flex: 1; padding: 15px; background: none; border: none; color: #888;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active { color: #00ff88; border-bottom: 3px solid #00ff88; }
        .icon-btn {
            background: none; border: none; color: #888; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s; padding: 0 20px;
            border-left: 1px solid rgba(255,255,255,0.1);
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn.synced { color: #00ff88; }

        .view { display: none; height: calc(100% - 50px); margin-top: 50px; position: relative; }
        .view.active { display: block; }

        #speed-container { 
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%); z-index: 1000; 
            background: rgba(20, 20, 20, 0.85); padding: 20px 40px; border-radius: 24px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-width: 140px;
        }
        #speed { font-size: 4.5rem; font-weight: 800; margin: 0; line-height: 1; }
        #unit { font-size: 1rem; color: #888; font-weight: 600; text-transform: uppercase; margin-top: 4px; }
        
        #hud-telemetry {
            display: flex; justify-content: center; gap: 14px; margin-top: 10px;
            font-size: 0.8rem; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 8px;
        }
        #hud-rpm { color: #ff4444; font-variant-numeric: tabular-nums; }
        #hud-gforce { color: #00ffff; font-variant-numeric: tabular-nums; }
        
        /* Bulletproof mobile map setup */
        #map { 
            height: 100%; width: 100%; z-index: 1; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
        }
        
        /* Master Control HUD layout */
        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px;
        }
        .stats-row {
            display: flex; justify-content: space-between; background: rgba(20, 20, 20, 0.9); 
            padding: 12px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .stat-item { text-align: center; flex: 1; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: #00ff88; }
        .stat-lbl { font-size: 0.65rem; color: #aaa; letter-spacing: 1px; margin-top: 2px; }

        .action-row { display: flex; gap: 10px; }
        .btn-action {
            flex: 1; padding: 16px; font-size: 1rem; font-weight: bold; color: #111;
            background: #00ff88; border: none; border-radius: 16px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2); transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-action.stop { background: #ff4444; color: white; box-shadow: 0 4px 20px rgba(255, 68, 68, 0.2); }
        .btn-launch { background: #ffaa00; color: #111; display: none; box-shadow: 0 4px 20px rgba(255, 170, 0, 0.2); }

        /* Sleek Maps-Style Live Navigation Card */
        #nav-summary-card {
            background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; padding: 16px; display: none; flex-direction: column; gap: 12px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .nav-meta-info { display: flex; justify-content: space-around; align-items: center; text-align: center; }
        .nav-meta-block { flex: 1; }
        .nav-meta-val { font-size: 1.6rem; font-weight: 800; color: #0078ff; }
        .nav-meta-lbl { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-top: 2px; letter-spacing: 0.5px; }
        .nav-meta-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.1); }
        
        .nav-btn-row { display: flex; gap: 10px; }
        .btn-nav-go { background: #0078ff; color: white; box-shadow: 0 4px 15px rgba(0, 120, 255, 0.3); }
        .btn-nav-cancel { background: #333; color: #eee; }

        /* History & Storage View */
        #history-view { padding: 20px; overflow-y: auto; background: #111; box-sizing: border-box; }
        .drive-card { background: #1a1a1a; padding: 16px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #292929; }
        .drive-card.is-ghost { border-color: #ffaa00; box-shadow: 0 4px 15px rgba(255, 170, 0, 0.1); }
        .drive-header { display: flex; justify-content: space-between; margin-bottom: 12px; color: #888; font-size: 0.8rem; font-weight: 500;}
        .drive-data { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;}
        .data-point { background: #222; padding: 10px; border-radius: 10px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.02);}
        .data-point span { color: #00ff88; font-weight: bold; display: block; font-size: 1.15rem; margin-top: 4px;}
        .card-actions { display: flex; gap: 10px; }
        .card-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; border: none; cursor: pointer; }
        .btn-ghost-toggle { background: #333; color: #aaa; }
        .btn-ghost-toggle.active { background: rgba(255, 170, 0, 0.2); color: #ffaa00; border: 1px solid #ffaa00; }
        .empty-state { text-align: center; color: #555; margin-top: 60px; font-size: 1.1rem; }

        /* Control Panel Configuration Overlay */
        #settings-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 4000;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none;
            justify-content: center; align-items: center;
        }
        .settings-card { background: #1a1a1a; padding: 25px; border-radius: 20px; width: 85%; border: 1px solid #333; }
        .settings-card h3 { margin: 0 0 20px 0; font-size: 1.5rem; text-align: center; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .setting-label { font-size: 1.1rem; font-weight: 500; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ff4444; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ff88; }
        input:checked + .slider:before { transform: translateX(26px); }
        .btn-close-settings { width: 100%; padding: 12px; background: #333; color: white; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; margin-top: 10px; }

        #debug-banner { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 2000; background: rgba(255, 170, 0, 0.9); color: #111; font-weight: bold; padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; display: none; }
        #toast { position: absolute; bottom: 260px; left: 50%; transform: translateX(-50%); z-index: 3000; background: rgba(0,0,0,0.85); color: #fff; border: 1px solid #333; padding: 10px 20px; border-radius: 30px; font-size: 0.85rem; display: none; text-align: center; width: max-content; }
        
        .leaflet-popup-content-wrapper { background: #111; color: #ffaa00; border: 1px solid #ffaa00; font-weight: bold; border-radius: 8px; }
        .leaflet-popup-tip { background: #111; }
        
        /* Dark-Mode Maps Styling For Geocoder and Routing Elements */
        .leaflet-control-geocoder { background: #1a1a1a !important; border: 1px solid rgba(255,255,255,0.15) !important; border-radius: 12px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.4) !important; margin-top: 65px !important; margin-left: 15px !important;}
        .leaflet-control-geocoder-icon { filter: invert(1); opacity: 0.8; }
        .leaflet-control-geocoder-form input { background: #222 !important; color: white !important; border: 1px solid #333 !important; border-radius: 6px !important; padding: 6px !important; }
        .leaflet-control-geocoder-results { background: #1a1a1a !important; color: white !important; border: 1px solid #333 !important; border-radius: 8px !important; margin-top: 5px !important; }
        .leaflet-control-geocoder-suggestion { padding: 10px 14px !important; border-bottom: 1px solid #292929; cursor: pointer; font-size: 0.9rem; }
        .leaflet-control-geocoder-suggestion:hover { background: #2a2a2a !important; color: #00ff88 !important; }
        
        /* Completely hide the bulky textual turn-by-turn list overlay container */
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <div id="debug-banner">SIMULATION ENGINE LABS</div>
    <div id="toast"></div>

    <div id="settings-overlay">
        <div class="settings-card">
            <h3>Control Panel</h3>
            <div class="setting-row">
                <span class="setting-label">Launch Mode</span>
                <span id="launch-mode-lbl" style="color:#888; font-size:0.8rem; margin-right: 10px;">MANUAL</span>
                <label class="switch">
                    <input type="checkbox" id="launch-toggle" checked onchange="window.toggleLaunchMode(this)">
                    <span class="slider"></span>
                </label>
            </div>
            <button class="btn-close-settings" onclick="document.getElementById('settings-overlay').style.display='none'">Close</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="window.switchTab('tracker', event)">Tracker</button>
        <button class="tab-btn" onclick="window.switchTab('history', event)">History</button>
        <button id="obd-toggle-btn" class="icon-btn" onclick="window.connectOBD()">⚙️</button>
        <button class="icon-btn" onclick="document.getElementById('settings-overlay').style.display='flex'">≡</button>
    </div>

    <div id="tracker-view" class="view active">
        <div id="speed-container" onclick="window.handleSpeedometerTap()">
            <div id="speed">0</div>
            <div id="unit">km/h</div>
            <div id="hud-telemetry">
                <span id="hud-rpm">RPM: --</span>
                <span id="hud-gforce">0.00 G</span>
            </div>
        </div>

        <div id="map"></div>

        <div class="controls">
            <div id="nav-summary-card">
                <div class="nav-meta-info">
                    <div class="nav-meta-block">
                        <div id="nav-val-time" class="nav-meta-val">--</div>
                        <div class="nav-meta-lbl">Duration</div>
                    </div>
                    <div class="nav-meta-divider"></div>
                    <div class="nav-meta-block">
                        <div id="nav-val-dist" class="nav-meta-val">--</div>
                        <div class="nav-meta-lbl">Distance</div>
                    </div>
                </div>
                <div class="nav-btn-row">
                    <button id="nav-cancel-btn" class="btn-action btn-nav-cancel" onclick="window.clearActiveRoute()">CANCEL</button>
                    <button id="nav-go-btn" class="btn-action btn-nav-go" onclick="window.acceptActiveRoute()">GO</button>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-item"><div class="stat-val" id="ui-max">0</div><div class="stat-lbl">MAX (km/h)</div></div>
                <div class="stat-item"><div class="stat-val" id="ui-dist">0.0</div><div class="stat-lbl">DIST (km)</div></div>
                <div class="stat-item"><div class="stat-val" id="ui-time">00:00</div><div class="stat-lbl">TIME</div></div>
            </div>
            <div class="action-row">
                <button id="toggle-drive-btn" class="btn-action" onclick="window.toggleDrive()">START DRIVE</button>
                <button id="manual-launch-btn" class="btn-action btn-launch" onclick="window.triggerManualLaunch()">LAUNCH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="view">
        <div id="history-container">
            <div class="empty-state">No drives saved yet.</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    
    <script>
        let settings = { launchMode: 'manual' }; 

        window.toggleLaunchMode = function(checkbox) {
            settings.launchMode = checkbox.checked ? 'manual' : 'auto';
            document.getElementById('launch-mode-lbl').innerText = settings.launchMode.toUpperCase();
            if (isDriving) {
                document.getElementById('manual-launch-btn').style.display = (settings.launchMode === 'manual' && !pullStartMs) ? 'block' : 'none';
            }
        };

        window.switchTab = function(tab, event) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + '-view').classList.add('active');
            if(event && event.target.classList.contains('tab-btn')) event.target.classList.add('active');
            
            if (tab === 'history') window.renderHistory();
            else if (tab === 'tracker') setTimeout(() => { map.invalidateSize(); }, 100);
        };

        // Standard position initialization mapping center of Bucharest region
        const map = L.map('map', { zoomControl: false }).setView([44.4782, 26.1481], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        
        let routingControl = null;
        let selectedDestination = null;
        let isNavigationActive = false;

        // Custom Geocoder Search Configuration
        L.Control.geocoder({ defaultMarkGeocode: false, position: 'topleft', placeholder: 'Search destination...' })
            .on('markgeocode', function(e) {
                const targetCoord = e.geocode.bbox.getCenter();
                window.buildNavigationRoute(targetCoord);
            }).addTo(map);

        // Click on map replaces problematic touch-hold selection architecture
        map.on('click', function(e) {
            if (isNavigationActive) return; // Prevent path adjustments during mid-route execution
            window.buildNavigationRoute(e.latlng);
        });

        window.buildNavigationRoute = function(destinationLatLng) {
            if (!lastPos) {
                window.showToast("Waiting for GPS lock... Move closer to window/outdoors");
                return;
            }
            if (routingControl) map.removeControl(routingControl);
            
            selectedDestination = destinationLatLng;
            
            routingControl = L.Routing.control({
                waypoints: [ L.latLng(lastPos.lat, lastPos.lng), selectedDestination ],
                routeWhileDragging: false,
                addWaypoints: false,
                show: false, 
                lineOptions: { styles: [{ color: '#0078ff', weight: 6, opacity: 0.85 }] }
            }).addTo(map);

            // Harvest spatial telemetry calculations from engine
            routingControl.on('routesfound', function(e) {
                const summary = e.routes[0].summary;
                const distKm = (summary.totalDistance / 1000).toFixed(1);
                const timeMins = Math.round(summary.totalTime / 60);

                document.getElementById('nav-val-time').innerText = timeMins + " min";
                document.getElementById('nav-val-dist').innerText = distKm + " km";
                
                // Show metadata hud sheet
                document.getElementById('nav-summary-card').style.display = 'flex';
            });
        };

        window.clearActiveRoute = function() {
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            selectedDestination = null;
            isNavigationActive = false;
            document.getElementById('nav-summary-card').style.display = 'none';
            window.showToast("Navigation Cancelled");
        };

        window.acceptActiveRoute = function() {
            if (!selectedDestination) return;
            isNavigationActive = true;
            document.getElementById('nav-go-btn').style.display = 'none'; // Lock navigation choice
            window.showToast("Route Loaded. Tap START DRIVE when ready.");
        };

        const marker = L.circleMarker([44.4782, 26.1481], { radius: 8, color: '#00ff88', fillColor: '#00ff88', fillOpacity: 1, zIndexOffset: 1000 }).addTo(map);
        let pathLine = L.polyline([], { color: '#00ff88', weight: 5, opacity: 0.8 }).addTo(map);
        
        const ghostStartZone = L.circle([0, 0], { radius: 50, color: '#ffaa00', fillColor: '#ffaa00', fillOpacity: 0.2 });
        const ghostMarker = L.circleMarker([0, 0], { radius: 8, color: '#ffaa00', fillColor: '#ffaa00', fillOpacity: 0.8, dashArray: '5, 5' });
        let activeGhostLap = null; 
        let ghostStaged = false;

        const radarLayer = L.layerGroup().addTo(map); 

        let isDriving = false;
        let driveStartTime = 0;
        let driveTimerInterval;
        let lastPos = null; // System Global Position Cache
        let radarsLoaded = false; 

        let currentDrive = { id: null, isGhost: false, date: null, duration: 0, distance: 0, maxSpeed: 0, best0to60: null, best0to100: null, route: [], telemetry: [] };
        
        let pullStartMs = null;
        let hit60 = false;
        let hit100 = false;
        let maxGForce = 0;

        let speedTapCount = 0;
        let speedTapTimeout = null;
        let isDebugMode = false;
        let debugInterval = null;

        const a3HighwayRoutePoints = [
            [44.47820, 26.14810], [44.47845, 26.14838], [44.47875, 26.14865], [44.47910, 26.14900],
            [44.47950, 26.14940], [44.47990, 26.14980], [44.48035, 26.15025], [44.48085, 26.15075],
            [44.48140, 26.15125], [44.48200, 26.15175], [44.48265, 26.15230], [44.48335, 26.15285]
        ];

        window.showToast = function(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        };

        if (typeof DeviceMotionEvent !== 'undefined') {
            window.addEventListener('devicemotion', (event) => {
                if (!isDriving) return;
                const acc = event.acceleration || event.accelerationIncludingGravity;
                if (!acc) return;
                const gForce = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z) / 9.81;
                const normalizedG = event.acceleration ? gForce : Math.abs(gForce - 1);

                if (normalizedG > maxGForce && normalizedG > 0.05) {
                    maxGForce = normalizedG;
                    document.getElementById('hud-gforce').innerText = maxGForce.toFixed(2) + " G";
                }

                if (settings.launchMode === 'auto' && normalizedG > 0.25 && currentDrive.maxSpeed < 3 && !pullStartMs) {
                    window.triggerManualLaunch(true);
                }
            });
        }

        window.triggerManualLaunch = function(isAuto = false) {
            pullStartMs = Date.now();
            hit60 = false;
            hit100 = false;
            document.getElementById('manual-launch-btn').style.display = 'none';
            window.showToast(isAuto ? "🚀 Auto-Launch Engaged!" : "🚀 Manual Launch Engaged!");
            if (ghostStaged && activeGhostLap) {
                ghostMarker.addTo(map);
                ghostStartZone.removeFrom(map);
            }
        };

        window.scanForRadars = async function(lat, lng) {
            const query = `[out:json];node["highway"="speed_camera"](around:10000, ${lat}, ${lng});out;`;
            try {
                const response = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
                if (!response.ok) throw new Error("Blocked");
                const data = await response.json();
                let cameraCount = 0;
                data.elements.forEach(c => {
                    L.circleMarker([c.lat, c.lon], { radius: 7, color: '#ff4444', fillColor: '#ff0000', fillOpacity: 0.8 }).addTo(radarLayer).bindPopup("⚠️ Speed Camera");
                    cameraCount++;
                });
                if (cameraCount > 0) setTimeout(() => window.showToast(`Loaded ${cameraCount} cameras.`), 2000);
            } catch (err) {
                console.warn("Radar framework restricted via network parameters.");
                if (isDebugMode) {
                    L.circleMarker([44.4800, 26.1500], { radius: 7, color: '#ff4444', fillColor: '#ff0000', fillOpacity: 0.8 }).addTo(radarLayer).bindPopup("⚠️ Mock Camera (Debug)");
                }
            }
        };

        window.calculateDistance = function(lat1, lon1, lat2, lon2) {
            const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        };

        window.formatTime = function(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        window.toggleDrive = function() {
            const btn = document.getElementById('toggle-drive-btn');
            const manualBtn = document.getElementById('manual-launch-btn');

            if (!isDriving) {
                isDriving = true;
                btn.innerText = "STOP";
                btn.classList.add('stop');
                
                driveStartTime = Date.now();
                pathLine.setLatLngs([]);
                radarLayer.clearLayers();
                pullStartMs = null; radarsLoaded = false; maxGForce = 0;
                document.getElementById('hud-gforce').innerText = "0.00 G";
                
                currentDrive = { id: Date.now(), isGhost: false, date: new Date().toLocaleString('ro-RO'), duration: 0, distance: 0, maxSpeed: 0, best0to60: null, best0to100: null, route: [], telemetry: [] };
                document.getElementById('ui-max').innerText = "0"; document.getElementById('ui-dist').innerText = "0.0";
                
                if (settings.launchMode === 'manual') manualBtn.style.display = 'block';

                let drives = JSON.parse(localStorage.getItem('drives') || '[]');
                activeGhostLap = drives.find(d => d.isGhost && d.telemetry && d.telemetry.length > 0);
                if (activeGhostLap) {
                    let startPoint = activeGhostLap.telemetry[0];
                    ghostStartZone.setLatLng([startPoint.lat, startPoint.lng]).addTo(map);
                    ghostStaged = false;
                }

                driveTimerInterval = setInterval(() => {
                    currentDrive.duration = Math.floor((Date.now() - driveStartTime) / 1000);
                    document.getElementById('ui-time').innerText = window.formatTime(currentDrive.duration);
                    if (ghostStaged && pullStartMs) updateGhostPosition();
                }, 100); 

                if (isDebugMode) window.runHighwaySimulation();

            } else {
                isDriving = false;
                btn.innerText = "START DRIVE";
                btn.classList.remove('stop');
                manualBtn.style.display = 'none';
                clearInterval(driveTimerInterval);
                if (debugInterval) clearInterval(debugInterval);
                
                ghostMarker.removeFrom(map);
                ghostStartZone.removeFrom(map);
                
                // Reset Navigation HUD card layout state upon termination
                window.clearActiveRoute();
                document.getElementById('nav-go-btn').style.display = 'block';

                if (currentDrive.distance > 0 || currentDrive.maxSpeed > 0) {
                    window.saveDrive(currentDrive);
                    window.showToast("Drive saved.");
                }
            }
        };

        window.updateGhostPosition = function() {
            let elapsedMs = Date.now() - pullStartMs;
            let tel = activeGhostLap.telemetry;
            
            for (let i = 0; i < tel.length - 1; i++) {
                if (elapsedMs >= tel[i].t && elapsedMs < tel[i+1].t) {
                    let p1 = tel[i]; let p2 = tel[i+1];
                    let progress = (elapsedMs - p1.t) / (p2.t - p1.t);
                    ghostMarker.setLatLng([p1.lat + (p2.lat - p1.lat) * progress, p1.lng + (p2.lng - p1.lng) * progress]);
                    return;
                }
            }
            if (elapsedMs >= tel[tel.length - 1].t) {
                ghostMarker.setLatLng([tel[tel.length - 1].lat, tel[tel.length - 1].lng]);
            }
        };

        window.saveDrive = function(driveData) {
            let drives = JSON.parse(localStorage.getItem('drives') || '[]');
            drives.unshift(driveData); 
            let ghostLaps = drives.filter(d => d.isGhost);
            let normalLaps = drives.filter(d => !d.isGhost).slice(0, 10);
            localStorage.setItem('drives', JSON.stringify([...ghostLaps, ...normalLaps]));
        };

        window.toggleGhostStatus = function(driveId) {
            let drives = JSON.parse(localStorage.getItem('drives') || '[]');
            let target = drives.find(d => d.id === driveId);
            if (target) {
                target.isGhost = !target.isGhost;
                localStorage.setItem('drives', JSON.stringify(drives));
                window.renderHistory();
            }
        };

        window.renderHistory = function() {
            const container = document.getElementById('history-container');
            let drives = JSON.parse(localStorage.getItem('drives') || '[]');
            if (drives.length === 0) { container.innerHTML = '<div class="empty-state">No drives saved yet.</div>'; return; }

            container.innerHTML = drives.map((d, index) => `
                <div class="drive-card ${d.isGhost ? 'is-ghost' : ''}" onclick="window.previewPastRoute(${index})">
                    <div class="drive-header"><span>${d.date}</span><span>${window.formatTime(d.duration)}</span></div>
                    <div class="drive-data">
                        <div class="data-point">Max<br><span>${d.maxSpeed} km/h</span></div>
                        <div class="data-point">Dist<br><span>${(d.distance/1000).toFixed(2)} km</span></div>
                        <div class="data-point">0-60<br><span>${d.best0to60 ? d.best0to60 + 's' : '--'}</span></div>
                        <div class="data-point">0-100<br><span>${d.best0to100 ? d.best0to100 + 's' : '--'}</span></div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn btn-ghost-toggle ${d.isGhost ? 'active' : ''}" onclick="event.stopPropagation(); window.toggleGhostStatus(${d.id})">
                            ${d.isGhost ? '🌟 GHOST ACTIVE' : 'Make Ghost'}
                        </button>
                    </div>
                </div>
            `).join('');
        };

        window.previewPastRoute = function(idx) {
            let drives = JSON.parse(localStorage.getItem('drives') || '[]');
            let targetDrive = drives[idx];
            if (!targetDrive || !targetDrive.route || targetDrive.route.length === 0) {
                alert("No GPS path saved for this log."); return;
            }
            if (window.historyPathLine) map.removeLayer(window.historyPathLine);
            window.historyPathLine = L.polyline(targetDrive.route, { color: '#00ffff', weight: 6, opacity: 0.9 }).addTo(map);
            map.fitBounds(window.historyPathLine.getBounds());
            window.switchTab('tracker', null);
        };

        window.processTelemetry = function(lat, lng, speedKmh) {
            // FIX: Global Position update occurs outside tracking loop block to feed search algorithms instantly
            lastPos = { lat, lng };

            document.getElementById('speed').innerText = speedKmh;
            const newLatLng = new L.LatLng(lat, lng);
            marker.setLatLng(newLatLng);
            map.panTo(newLatLng);

            // Real-Time Turn-By-Turn Auto Recalculation engine processing logic
            if (isNavigationActive && routingControl) {
                routingControl.spliceWaypoints(0, 1, L.latLng(lat, lng));
            }

            if (isDriving) {
                if (!radarsLoaded) { radarsLoaded = true; window.scanForRadars(lat, lng); }

                currentDrive.route.push([lat, lng]);
                
                if (pullStartMs) {
                    currentDrive.telemetry.push({ lat: lat, lng: lng, t: Date.now() - pullStartMs });
                }

                if (!ghostStaged && activeGhostLap && !pullStartMs) {
                    let startPoint = activeGhostLap.telemetry[0];
                    if (window.calculateDistance(lat, lng, startPoint.lat, startPoint.lng) < 30) {
                        ghostStaged = true;
                        window.showToast("👻 Ghost Start Line Reached! Awaiting Launch.");
                        ghostMarker.setLatLng([startPoint.lat, startPoint.lng]).addTo(map);
                    }
                }
                
                pathLine.addLatLng(newLatLng);

                if (currentDrive.route.length > 1) {
                    let prevIdx = currentDrive.route.length - 2;
                    let prevPoint = currentDrive.route[prevIdx];
                    const distMeters = window.calculateDistance(prevPoint[0], prevPoint[1], lat, lng);
                    currentDrive.distance += distMeters;
                    document.getElementById('ui-dist').innerText = (currentDrive.distance / 1000).toFixed(2);
                }

                if (speedKmh > currentDrive.maxSpeed) {
                    currentDrive.maxSpeed = speedKmh;
                    document.getElementById('ui-max').innerText = currentDrive.maxSpeed;
                }

                if (pullStartMs) {
                    let pullTime = ((Date.now() - pullStartMs) / 1000).toFixed(1);
                    if (speedKmh >= 60 && !hit60) { hit60 = true; currentDrive.best0to60 = pullTime; window.showToast(`0-60: ${pullTime}s`); }
                    if (speedKmh >= 100 && !hit100) { hit100 = true; currentDrive.best0to100 = pullTime; window.showToast(`0-100: ${pullTime}s`); }
                } 
                
                if (speedKmh > 5 && document.getElementById('manual-launch-btn').style.display === 'block') {
                    window.triggerManualLaunch(false); 
                }
            }
        };

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((p) => {
                if (isDebugMode) return; 
                window.processTelemetry(p.coords.latitude, p.coords.longitude, Math.round((p.coords.speed || 0) * 3.6));
            }, (e) => console.error(e.message), { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        window.handleSpeedometerTap = function() {
            speedTapCount++; clearTimeout(speedTapTimeout);
            speedTapTimeout = setTimeout(() => { speedTapCount = 0; }, 1500);
            if (speedTapCount >= 5) {
                speedTapCount = 0; isDebugMode = !isDebugMode;
                document.getElementById('debug-banner').style.display = isDebugMode ? 'block' : 'none';
                if (!isDebugMode && debugInterval) { clearInterval(debugInterval); if (isDriving) window.toggleDrive(); }
            }
        };

        window.runHighwaySimulation = function() {
            let timerTicks = 0; let simulatedSpeed = 0; currentSimIndex = 0;
            exactSimLat = a3HighwayRoutePoints[0][0]; exactSimLng = a3HighwayRoutePoints[0][1];

            setTimeout(() => { if(!pullStartMs) window.triggerManualLaunch(true); }, 2000);

            debugInterval = setInterval(() => {
                timerTicks++;
                if (timerTicks < 6) { 
                    simulatedSpeed += 24; 
                    let mockG = (Math.random() * 0.2 + 0.55); 
                    if (mockG > maxGForce) { maxGForce = mockG; document.getElementById('hud-gforce').innerText = maxGForce.toFixed(2) + " G"; }
                } 
                else if (timerTicks < 18) { 
                    simulatedSpeed += 6; if (simulatedSpeed > 135) simulatedSpeed = 135; 
                    let mockG = (Math.random() * 0.1 + 0.15);
                    if (mockG > maxGForce) { maxGForce = mockG; document.getElementById('hud-gforce').innerText = maxGForce.toFixed(2) + " G"; }
                } 
                else if (timerTicks < 25) { simulatedSpeed -= 15; if (simulatedSpeed < 0) simulatedSpeed = 0; } 
                else { simulatedSpeed = 0; }

                document.getElementById('hud-rpm').innerText = `RPM: ${simulatedSpeed === 0 ? 780 : Math.min(5600, Math.floor(simulatedSpeed * 40 + 1000))}`;
                let speedMetersPerSec = simulatedSpeed / 3.6;

                if (simulatedSpeed > 0 && currentSimIndex < a3HighwayRoutePoints.length - 1) {
                    let targetPoint = a3HighwayRoutePoints[currentSimIndex + 1];
                    let distToNext = window.calculateDistance(exactSimLat, exactSimLng, targetPoint[0], targetPoint[1]);

                    if (speedMetersPerSec >= distToNext) {
                        currentSimIndex++; exactSimLat = targetPoint[0]; exactSimLng = targetPoint[1];
                    } else {
                        let progress = speedMetersPerSec / distToNext;
                        exactSimLat += (targetPoint[0] - exactSimLat) * progress;
                        exactSimLng += (targetPoint[1] - exactSimLng) * progress;
                    }
                }
                window.processTelemetry(exactSimLat, exactSimLng, simulatedSpeed);
                if (timerTicks >= 28 || currentSimIndex >= a3HighwayRoutePoints.length - 1) {
                    clearInterval(debugInterval); if (isDriving) window.toggleDrive();
                }
            }, 1000);
        };
    </script>
</body>
</html>
