<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive Tracker Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #111; color: white; overflow: hidden;
        }
        
        .nav-tabs {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 2000;
            display: flex; background: rgba(10, 10, 10, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .tab-btn {
            flex: 1; padding: 15px; background: none; border: none; color: #888;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active { color: #00ff88; border-bottom: 3px solid #00ff88; }

        .view { display: none; height: calc(100% - 50px); margin-top: 50px; position: relative; }
        .view.active { display: block; }

        #debug-banner {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 2000;
            background: rgba(255, 170, 0, 0.9); color: #111; font-weight: bold; padding: 6px 16px;
            border-radius: 20px; font-size: 0.75rem; display: none; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #speed-container { 
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%); z-index: 1000; 
            background: rgba(20, 20, 20, 0.85); padding: 20px 40px; border-radius: 24px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #speed { font-size: 4.5rem; font-weight: 800; margin: 0; line-height: 1; }
        #unit { font-size: 1rem; color: #888; font-weight: 600; text-transform: uppercase; margin-top: 4px; }
        
        #map { height: 100%; width: 100%; z-index: 1; }
        
        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 350px;
        }
        .stats-row {
            display: flex; justify-content: space-between; background: rgba(20, 20, 20, 0.9); 
            padding: 12px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .stat-item { text-align: center; flex: 1; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: #00ff88; }
        .stat-lbl { font-size: 0.65rem; color: #aaa; letter-spacing: 1px; margin-top: 2px; }

        .btn-action {
            width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; color: #111;
            background: #00ff88; border: none; border-radius: 16px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2); transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-action.stop { background: #ff4444; color: white; box-shadow: 0 4px 20px rgba(255, 68, 68, 0.2); }

        #history-view { padding: 20px; overflow-y: auto; background: #111; box-sizing: border-box; }
        .drive-card {
            background: #1a1a1a; padding: 16px; border-radius: 16px; margin-bottom: 15px;
            border: 1px solid #292929; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .drive-card:active { background: #222; }
        .drive-header { display: flex; justify-content: space-between; margin-bottom: 12px; color: #888; font-size: 0.8rem; font-weight: 500;}
        .drive-data { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .data-point { background: #222; padding: 10px; border-radius: 10px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.02);}
        .data-point span { color: #00ff88; font-weight: bold; display: block; font-size: 1.15rem; margin-top: 4px;}
        .view-route-lbl { text-align: center; font-size: 0.75rem; color: #666; margin-top: 12px; font-style: italic; letter-spacing: 0.5px; }
        .empty-state { text-align: center; color: #555; margin-top: 60px; font-size: 1.1rem; }

        #toast {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); z-index: 3000;
            background: rgba(0,0,0,0.85); color: #fff; border: 1px solid #333; padding: 10px 20px;
            border-radius: 30px; font-size: 0.85rem; display: none; backdrop-filter: blur(5px);
        }
        
        .leaflet-popup-content-wrapper { background: #111; color: #ff4444; border: 1px solid #ff4444; font-weight: bold; border-radius: 8px; }
        .leaflet-popup-tip { background: #111; }
    </style>
</head>
<body>

    <div id="debug-banner">SIMULATION ENGINE LABS</div>
    <div id="toast"></div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="window.switchTab('tracker', event)">Tracker</button>
        <button class="tab-btn" onclick="window.switchTab('history', event)">History</button>
    </div>

    <div id="tracker-view" class="view active">
        <div id="speed-container" onclick="window.handleSpeedometerTap()">
            <div id="speed">0</div>
            <div id="unit">km/h</div>
        </div>

        <div id="map"></div>

        <div class="controls">
            <div class="stats-row">
                <div class="stat-item"><div class="stat-val" id="ui-max">0</div><div class="stat-lbl">MAX (km/h)</div></div>
                <div class="stat-item"><div class="stat-val" id="ui-dist">0.0</div><div class="stat-lbl">DIST (km)</div></div>
                <div class="stat-item"><div class="stat-val" id="ui-time">00:00</div><div class="stat-lbl">TIME</div></div>
            </div>
            <button id="toggle-drive-btn" class="btn-action" onclick="window.toggleDrive()">START DRIVE</button>
        </div>
    </div>

    <div id="history-view" class="view">
        <div id="history-container">
            <div class="empty-state">No drives saved yet.</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // System Layout Control - Bound globally
        window.switchTab = function(tab, event) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + '-view').classList.add('active');
            if(event) event.target.classList.add('active');
            
            if (tab === 'history') {
                window.renderHistory();
            } else if (tab === 'tracker') {
                setTimeout(() => { map.invalidateSize(); }, 100);
            }
        };

        const map = L.map('map', { zoomControl: false }).setView([44.4782, 26.1481], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        
        const marker = L.circleMarker([44.4782, 26.1481], { radius: 8, color: '#00ff88', fillColor: '#00ff88', fillOpacity: 1 }).addTo(map);
        let pathLine = L.polyline([], { color: '#00ff88', weight: 5, opacity: 0.8 }).addTo(map);
        let historyPathLine = null;
        const radarLayer = L.layerGroup().addTo(map); 

        let isDriving = false;
        let driveStartTime = 0;
        let driveTimerInterval;
        let watchId = null;
        let lastPos = null;
        let radarsLoaded = false; 

        let currentDrive = {
            date: null, duration: 0, distance: 0, maxSpeed: 0,
            timeToMaxSpeed: null, best0to60: null, best0to100: null, route: []
        };

        let pullStartMs = null;
        let hit60 = false;
        let hit100 = false;

        let speedTapCount = 0;
        let speedTapTimeout = null;
        let isDebugMode = false;
        let debugInterval = null;

        const a3HighwayRoutePoints = [
            [44.47820, 26.14810], [44.47845, 26.14838], [44.47875, 26.14865], [44.47910, 26.14900],
            [44.47950, 26.14940], [44.47990, 26.14980], [44.48035, 26.15025], [44.48085, 26.15075],
            [44.48140, 26.15125], [44.48200, 26.15175], [44.48265, 26.15230], [44.48335, 26.15285],
            [44.48410, 26.15340], [44.48490, 26.15400], [44.48575, 26.15460], [44.48665, 26.15525],
            [44.48755, 26.15590], [44.48850, 26.15655], [44.48950, 26.15720], [44.49055, 26.15790],
            [44.49160, 26.15860], [44.49270, 26.15935], [44.49380, 26.16010], [44.49495, 26.16085],
            [44.49615, 26.16165], [44.49735, 26.16245], [44.49860, 26.16325], [44.49985, 26.16410],
            [44.50115, 26.16495], [44.50245, 26.16580], [44.50380, 26.16665], [44.50515, 26.16755]
        ];

        let currentSimIndex = 0;
        let exactSimLat = a3HighwayRoutePoints[0][0];
        let exactSimLng = a3HighwayRoutePoints[0][1];

        window.showToast = function(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        };

        window.scanForRadars = async function(lat, lng) {
            window.showToast("Scanning for nearby speed cameras (10km)...");
            
            const query = `
                [out:json];
                node["highway"="speed_camera"](around:10000, ${lat}, ${lng});
                out;
            `;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

            try {
                // Added explicit headers to try and ease local CORS, though a local server is still recommended
                const response = await fetch(url, { method: 'GET', mode: 'cors' });
                
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                
                const data = await response.json();
                let cameraCount = 0;
                
                data.elements.forEach(camera => {
                    L.circleMarker([camera.lat, camera.lon], { 
                        radius: 7, color: '#ff4444', fillColor: '#ff0000', fillOpacity: 0.8, weight: 2
                    }).addTo(radarLayer).bindPopup("⚠️ Fixed Speed Camera");
                    cameraCount++;
                });
                
                if (cameraCount > 0) {
                    setTimeout(() => window.showToast(`Loaded ${cameraCount} fixed cameras on map.`), 2500);
                }
            } catch (error) {
                console.error("Failed to fetch radar data:", error);
                setTimeout(() => window.showToast("Radar failed: Use a local server (e.g. Live Server) to fix CORS"), 3500);
            }
        };

        window.handleSpeedometerTap = function() {
            speedTapCount++;
            clearTimeout(speedTapTimeout);
            
            speedTapTimeout = setTimeout(() => { speedTapCount = 0; }, 1500);

            if (speedTapCount >= 5) {
                speedTapCount = 0;
                isDebugMode = !isDebugMode;
                document.getElementById('debug-banner').style.display = isDebugMode ? 'block' : 'none';
                
                if (!isDebugMode && debugInterval) {
                    clearInterval(debugInterval);
                    if (isDriving) window.toggleDrive();
                }
                window.showToast(isDebugMode ? "Simulation profiles initialized" : "Standard GPS restored");
            }
        };

        window.calculateDistance = function(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        };

        window.formatTime = function(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        window.toggleDrive = function() {
            const btn = document.getElementById('toggle-drive-btn');
            
            if (historyPathLine) {
                map.removeLayer(historyPathLine);
                historyPathLine = null;
            }

            if (!isDriving) {
                isDriving = true;
                btn.innerText = "STOP & SAVE DRIVE";
                btn.classList.add('stop');
                
                driveStartTime = Date.now();
                pathLine.setLatLngs([]);
                radarLayer.clearLayers();
                lastPos = null;
                pullStartMs = null;
                radarsLoaded = false; 
                
                currentDrive = {
                    date: new Date().toLocaleString('ro-RO'), duration: 0, distance: 0, 
                    maxSpeed: 0, timeToMaxSpeed: null, best0to60: null, best0to100: null, route: []
                };

                document.getElementById('ui-max').innerText = "0";
                document.getElementById('ui-dist').innerText = "0.0";
                
                driveTimerInterval = setInterval(() => {
                    currentDrive.duration = Math.floor((Date.now() - driveStartTime) / 1000);
                    document.getElementById('ui-time').innerText = window.formatTime(currentDrive.duration);
                }, 1000);

                if (isDebugMode) window.runHighwaySimulation();

            } else {
                isDriving = false;
                btn.innerText = "START DRIVE";
                btn.classList.remove('stop');
                clearInterval(driveTimerInterval);
                if (debugInterval) clearInterval(debugInterval);
                
                if (currentDrive.distance > 0 || currentDrive.maxSpeed > 0) {
                    window.saveDrive(currentDrive);
                    window.showToast("Drive profile successfully processed");
                }
            }
        };

        window.saveDrive = function(driveData) {
            let drives = JSON.parse(localStorage.getItem('drives') || '[]');
            drives.unshift(driveData); 
            if (drives.length > 10) drives = drives.slice(0, 10);
            localStorage.setItem('drives', JSON.stringify(drives));
        };

        window.renderHistory = function() {
            const container = document.getElementById('history-container');
            let drives = JSON.parse(localStorage.getItem('drives') || '[]');
            
            if (drives.length === 0) {
                container.innerHTML = '<div class="empty-state">No drives saved yet.</div>';
                return;
            }

            container.innerHTML = drives.map((d, index) => `
                <div class="drive-card" onclick="window.previewPastRoute(${index})">
                    <div class="drive-header">
                        <span>${d.date}</span>
                        <span>${window.formatTime(d.duration)}</span>
                    </div>
                    <div class="drive-data">
                        <div class="data-point">Max Speed<br><span>${d.maxSpeed} km/h</span></div>
                        <div class="data-point">Distance<br><span>${(d.distance/1000).toFixed(2)} km</span></div>
                        <div class="data-point">0 - 60 km/h<br><span>${d.best0to60 ? d.best0to60 + 's' : '--'}</span></div>
                        <div class="data-point">0 - 100 km/h<br><span>${d.best0to100 ? d.best0to100 + 's' : '--'}</span></div>
                    </div>
                    <div class="view-route-lbl">Tap to render path vectors on map</div>
                </div>
            `).join('');
        };

        window.previewPastRoute = function(idx) {
            let drives = JSON.parse(localStorage.getItem('drives') || '[]');
            let targetDrive = drives[idx];
            
            if (!targetDrive || !targetDrive.route || targetDrive.route.length === 0) {
                alert("No route path structure exists for this log.");
                return;
            }

            if (historyPathLine) map.removeLayer(historyPathLine);

            historyPathLine = L.polyline(targetDrive.route, { color: '#00ffff', weight: 6, opacity: 0.9 }).addTo(map);
            map.fitBounds(historyPathLine.getBounds());
            window.switchTab('tracker', null);
        };

        window.processTelemetry = function(lat, lng, speedKmh) {
            document.getElementById('speed').innerText = speedKmh;
            const newLatLng = new L.LatLng(lat, lng);
            marker.setLatLng(newLatLng);
            map.panTo(newLatLng);

            if (isDriving) {
                if (!radarsLoaded) {
                    radarsLoaded = true; 
                    window.scanForRadars(lat, lng);
                }

                currentDrive.route.push([lat, lng]);
                pathLine.addLatLng(newLatLng);

                if (lastPos) {
                    const distMeters = window.calculateDistance(lastPos.lat, lastPos.lng, lat, lng);
                    currentDrive.distance += distMeters;
                    document.getElementById('ui-dist').innerText = (currentDrive.distance / 1000).toFixed(2);
                }
                lastPos = { lat, lng };

                if (speedKmh > currentDrive.maxSpeed) {
                    currentDrive.maxSpeed = speedKmh;
                    currentDrive.timeToMaxSpeed = currentDrive.duration;
                    document.getElementById('ui-max').innerText = currentDrive.maxSpeed;
                }

                if (speedKmh <= 1) {
                    pullStartMs = Date.now();
                    hit60 = false;
                    hit100 = false;
                } else if (pullStartMs) {
                    let pullTime = ((Date.now() - pullStartMs) / 1000).toFixed(1);
                    
                    if (speedKmh >= 60 && !hit60) {
                        hit60 = true;
                        currentDrive.best0to60 = pullTime;
                    }
                    if (speedKmh >= 100 && !hit100) {
                        hit100 = true;
                        currentDrive.best0to100 = pullTime;
                    }
                }
            }
        };

        if ("geolocation" in navigator) {
            watchId = navigator.geolocation.watchPosition((position) => {
                if (isDebugMode) return; 
                
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const speedMs = position.coords.speed || 0; 
                let speedKmh = Math.round(speedMs * 3.6);
                if (position.coords.speed === null) speedKmh = 0;

                window.processTelemetry(lat, lng, speedKmh);
            }, (error) => {
                console.error(error.message);
            }, {
                enableHighAccuracy: true, maximumAge: 0, timeout: 5000
            });
        }

        window.runHighwaySimulation = function() {
            let timerTicks = 0;
            let simulatedSpeed = 0;
            currentSimIndex = 0;
            
            exactSimLat = a3HighwayRoutePoints[0][0];
            exactSimLng = a3HighwayRoutePoints[0][1];

            debugInterval = setInterval(() => {
                timerTicks++;

                if (timerTicks < 6) {
                    simulatedSpeed += 12; 
                } else if (timerTicks < 18) {
                    simulatedSpeed += 6;  
                    if (simulatedSpeed > 135) simulatedSpeed = 135;
                } else if (timerTicks < 25) {
                    simulatedSpeed -= 15; 
                    if (simulatedSpeed < 0) simulatedSpeed = 0;
                } else {
                    simulatedSpeed = 0;   
                }

                let speedMetersPerSec = simulatedSpeed / 3.6;

                if (simulatedSpeed > 0 && currentSimIndex < a3HighwayRoutePoints.length - 1) {
                    let targetPoint = a3HighwayRoutePoints[currentSimIndex + 1];
                    let distToNext = window.calculateDistance(exactSimLat, exactSimLng, targetPoint[0], targetPoint[1]);

                    if (speedMetersPerSec >= distToNext) {
                        currentSimIndex++;
                        exactSimLat = targetPoint[0];
                        exactSimLng = targetPoint[1];
                    } else {
                        let travelRatio = speedMetersPerSec / distToNext;
                        exactSimLat += (targetPoint[0] - exactSimLat) * travelRatio;
                        exactSimLng += (targetPoint[1] - exactSimLng) * travelRatio;
                    }
                }

                window.processTelemetry(exactSimLat, exactSimLng, simulatedSpeed);
                
                if (timerTicks >= 28 || currentSimIndex >= a3HighwayRoutePoints.length - 1) {
                    clearInterval(debugInterval);
                    if (isDriving) window.toggleDrive();
                }
            }, 1000);
        };
    </script>
</body>
</html>
