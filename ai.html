<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick AI</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #000000; /* Deep black background */
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
            background: #121212; 
            display: flex;
            flex-direction: column;
        }
        .msg { 
            margin-bottom: 12px; 
            padding: 10px 14px; 
            border-radius: 18px; 
            max-width: 85%; 
            word-wrap: break-word; 
            font-size: 16px; 
            line-height: 1.4;
        }
        .user { 
            background: #0a84ff; /* iOS Dark Mode Blue */
            color: #ffffff; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
        }
        .ai { 
            background: #2c2c2e; /* iOS Dark Mode Gray */
            color: #ffffff; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px;
        }
        #controls { 
            padding: 10px; 
            background: #1c1c1e; 
            border-top: 1px solid #38383a; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        select, input, button { 
            font-size: 16px; 
            padding: 10px; 
            border: 1px solid #48484a; 
            border-radius: 8px; 
            width: 100%;
            background: #2c2c2e;
            color: #ffffff;
        }
        #input-area { 
            display: flex; 
            gap: 8px; 
        }
        input { 
            flex: 1; 
        }
        input::placeholder {
            color: #8e8e93;
        }
        button { 
            background: #0a84ff; 
            color: #ffffff; 
            border: none; 
            font-weight: bold; 
            width: auto;
            padding: 10px 16px;
        }
        .danger-btn {
            background: #ff453a;
            width: 100%;
        }

        /* Markdown Formatting Styles */
        pre {
            background: #000000;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 14px;
            border: 1px solid #38383a;
            margin: 8px 0;
        }
        code {
            font-family: Menlo, Monaco, Consolas, monospace;
            background: #000000;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 14px;
        }
        pre code {
            padding: 0;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div id="controls">
        <select id="model">
            <option value="openrouter/free">OpenRouter Auto (Best Free Model)</option>
            <option value="openai/gpt-oss-120b:free">GPT-OSS 120B (Free)</option>
            <option value="qwen/qwen3-coder:free">Qwen3 Coder (Free)</option>
            <option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B (Free)</option>
        </select>
        <div id="input-area">
            <input type="text" id="msg" placeholder="Message..." autocomplete="off">
            <button onclick="send()">Send</button>
        </div>
        <button class="danger-btn" onclick="clearChat()">Clear Chat</button>
    </div>

    <script>
        var apiKey = "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";
        var chatDiv = document.getElementById('chat');
        var inputEl = document.getElementById('msg');
        var modelEl = document.getElementById('model');
        
        var historyData = [];
        try {
            var stored = localStorage.getItem('secretChatHistory');
            if (stored) historyData = JSON.parse(stored);
        } catch(e) { }

        // Lightweight custom markdown parser for older iOS
        function formatText(text) {
            // Escape basic HTML to prevent code execution
            var html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // Format code blocks ```code```
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            
            // Format inline code `code`
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Format Bold **text**
            html = html.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
            
            // Format Italic *text*
            html = html.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
            
            // Convert line breaks to <br> tags (ignoring breaks inside <pre> tags roughly)
            html = html.split('\n').join('<br>');
            
            return html;
        }

        function render() {
            chatDiv.innerHTML = '';
            for (var i = 0; i < historyData.length; i++) {
                if (historyData[i].role === 'system') continue;
                
                var d = document.createElement('div');
                d.className = 'msg ' + (historyData[i].role === 'user' ? 'user' : 'ai');
                d.innerHTML = formatText(historyData[i].content);
                chatDiv.appendChild(d);
            }
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        render();

        function save() {
            try {
                localStorage.setItem('secretChatHistory', JSON.stringify(historyData));
            } catch(e) { }
        }

        function send() {
            var text = inputEl.value.trim();
            if(!text) return;
            
            historyData.push({role: 'user', content: text});
            inputEl.value = '';
            render();
            save();

            var loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg ai';
            loadingDiv.textContent = 'Thinking...';
            chatDiv.appendChild(loadingDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;

            fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + apiKey,
                    "HTTP-Referer": "http://localhost",
                    "X-Title": "Secret iPhone App",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: modelEl.value,
                    messages: historyData
                })
            }).then(function(res) {
                return res.json();
            }).then(function(data) {
                chatDiv.removeChild(loadingDiv);
                if (data && data.choices && data.choices[0] && data.choices[0].message) {
                    historyData.push(data.choices[0].message);
                } else {
                    historyData.push({role: 'assistant', content: "API Error. Try a different free model."});
                }
                render();
                save();
            }).catch(function(err) {
                chatDiv.removeChild(loadingDiv);
                historyData.push({role: 'assistant', content: "Network error. Make sure you have a connection."});
                render();
                save();
            });
        }

        function clearChat() {
            historyData = [];
            save();
            render();
        }

        inputEl.addEventListener("keyup", function(event) {
            if (event.keyCode === 13) {
                send();
            }
        });
    </script>
</body>
</html>
